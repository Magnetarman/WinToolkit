name: Feature Request
description: Propose a new idea, script or improvement for WinToolkit
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do you have an idea to make WinToolkit better? Share it with us.
        *Remember: 1 issue = 1 single feature.*

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem or situation behind this request.
      placeholder: For example, setting X currently requires too many manual steps.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: I would like a new button in menu Y that automates Z.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Did you consider other ways to achieve the same result?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, code examples, mockups or links to similar tools.
    validations:
      required: false

  - type: checkboxes
    id: logic-check
    attributes:
      label: Contribution Agreement
      options:
        - label: I understand that this proposal will be evaluated against the current project roadmap.
          required: true
