name: Feature Enhancement
description: Suggest an improvement to an existing feature.
title: "[ENHANCEMENT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest improvements here. One issue per improvement.

  - type: checkboxes
    id: critical-checks
    attributes:
      label: Preliminary Checks
      description: Confirm these checks before opening.
      options:
        - label: I checked that no existing issue reports the same improvement.
          required: true
        - label: I am using the latest available WinToolkit version.
          required: true
        - label: This proposal improves an existing feature rather than adding a new feature.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: Describe the current behavior.
      placeholder: For example, disk cleanup currently removes only basic temporary files.
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: Proposed Improvement
      description: Describe the proposed change.
      placeholder: For example, include Windows Update cache files and system logs older than seven days.
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Explain the user benefits.
      placeholder: This would recover more disk space automatically without manual intervention.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this improvement?
      options:
        - Low (small usability optimization)
        - Medium (significantly improves an existing feature)
        - High (removes an important limitation)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Did you consider other approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots or links.
    validations:
      required: false

  - type: checkboxes
    id: logic-check
    attributes:
      label: Contribution Agreement
      options:
        - label: I understand that this proposal will be evaluated against the current project roadmap.
          required: true
