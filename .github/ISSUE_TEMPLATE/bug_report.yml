name: Bug Report
description: Report a WinToolkit bug.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report bugs here. One issue per bug.

  - type: checkboxes
    id: critical-checks
    attributes:
      label: Preliminary Checks
      description: Confirm these checks before opening.
      options:
        - label: I checked that no existing issue reports the same problem.
          required: true
        - label: I am using the latest available WinToolkit version.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem.
      placeholder: What exactly happens?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce.
      placeholder: |
        1. Start WinToolkit
        2. Select the '...' option
        3. Run '...'
        4. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected-output
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: For example, the application should display a success message.
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: For example, the console displays an 'Access denied' error.
    validations:
      required: true

  - type: dropdown
    id: os-version
    attributes:
      label: Windows OS Version
      description: Which Windows version?
      options:
        - Windows 11 25H2
        - Windows 11 24H2
        - Windows 11 23H2
        - Windows 11 22H2
        - Windows 10 22H2
        - Windows 10 21H2
        - Windows Server 2022
        - Other (describe in the context field)
    validations:
      required: true

  - type: dropdown
    id: ps-version
    attributes:
      label: PowerShell Version
      description: Run $PSVersionTable to check.
      options:
        - PowerShell 7.4+ (Core)
        - PowerShell 7.2+ (LTS)
        - Windows PowerShell 5.1
    validations:
      required: true

  - type: input
    id: profile-version
    attributes:
      label: PowerShell Profile Version
      description: Provide the loaded profile version.
      placeholder: For example, 2.5.2.10
    validations:
      required: true

  - type: checkboxes
    id: is-windows-bug
    attributes:
      label: Bug Type
      options:
        - label: This is a Windows bug caused by a specific Windows version.

  - type: checkboxes
    id: logs-check
    attributes:
      label: Log Attachment (Required)
      description: |
        Attach the .zip log file generated via Export WinToolkit Log.
      options:
        - label: I generated and attached the `.zip` log file below.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, videos, or links.
      placeholder: Additional details...
