name: Bug Report
description: Report a WinToolkit malfunction for users and developers
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please complete the fields below so we can investigate it quickly.
        *Remember our rule: 1 issue = 1 single problem.*

  - type: checkboxes
    id: critical-checks
    attributes:
      label: Preliminary Checks
      description: Confirm these checks before opening the issue.
      options:
        - label: I checked that no existing issue reports the same problem.
          required: true
        - label: I am using the latest available WinToolkit version.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of the problem.
      placeholder: What exactly happens?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What should we do to reproduce the unexpected behavior?
      placeholder: |
        1. Start WinToolkit
        2. Select the '...' option
        3. Run '...'
        4. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected-output
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: For example, the application should display a success message.
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: Actual Behavior
      description: What happens instead? Include any red console errors.
      placeholder: For example, the console displays an 'Access denied' error.
    validations:
      required: true

  - type: dropdown
    id: os-version
    attributes:
      label: Windows OS Version
      description: Which Windows version shows the problem?
      options:
        - Windows 11 25H2
        - Windows 11 24H2
        - Windows 11 23H2
        - Windows 11 22H2
        - Windows 10 22H2
        - Windows 10 21H2
        - Windows Server 2022
        - Other (describe in the context field)
    validations:
      required: true

  - type: dropdown
    id: ps-version
    attributes:
      label: PowerShell Version
      description: Which PowerShell version are you using? Run $PSVersionTable to check.
      options:
        - PowerShell 7.4+ (Core)
        - PowerShell 7.2+ (LTS)
        - Windows PowerShell 5.1
    validations:
      required: true

  - type: input
    id: profile-version
    attributes:
      label: PowerShell Profile Version
      description: Provide the loaded profile version, shown in the terminal startup message.
      placeholder: For example, 2.5.2.10
    validations:
      required: true

  - type: checkboxes
    id: is-windows-bug
    attributes:
      label: Bug Type
      options:
        - label: This is a Windows bug caused by a specific Windows version.

  - type: checkboxes
    id: logs-check
    attributes:
      label: Log Attachment (Required)
      description: |
        Logs are essential for diagnosing the problem.
        1. Start WinToolkit.
        2. Select **Export WinToolkit Log**.
        3. Attach the `.zip` file saved on your Desktop.
      options:
        - label: I generated and attached the `.zip` log file below.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any useful information, such as screenshots, videos or links.
      placeholder: Additional details...
