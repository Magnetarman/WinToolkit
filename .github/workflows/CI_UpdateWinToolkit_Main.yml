# =============================================================================
# WinToolkit Enterprise CI/CD Pipeline — Main Branch Protection V 3.3.1
# =============================================================================
# Pipeline per il ramo 'main' — Protezione stabilità e gestione release stabili.
#
# FLUSSO:
#   • PR opened/synchronize → Guard + Lint/Test + Versioning Bump su Dev
#   • PR closed (merged)    → Stable Release su GitHub (tag + release notes)
#
# PROTEZIONE MAIN:
#   • Blocco totale a contributi esterni — solo maintainer (@magnetarman)
#   • PR non-release/v* autorizzate ma con avviso
#   • Linting + Testing obbligatori prima del merge
#
# RELEASE STABILE (al merge della PR release/v*):
#   • Lettura versione + metriche da WinToolkit.ps1 compilato
#   • Generazione release notes con commit categorizzati (New-ReleaseNotes.ps1)
#   • Creazione GitHub Release su main con tag vX.Y.Z
#
# REGOLA D'ORO (Integrità):
#   WinToolkit.ps1 è sempre rigenerato da zero dai sorgenti puri.
#   Il file pre-esistente viene eliminato prima di ogni compilazione per evitare
#   che residui di versioni precedenti o conflitti di merge producano output corrotto.
#
# RUNTIME: GitHub Actions (ubuntu-latest & windows-latest)
# =============================================================================

name: CI_WinToolkit_Main_Protection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ---------------------------------------------------------------------------
# TRIGGER
# Si attiva sulle Pull Request che hanno come target il ramo 'main'.
# Tipi coperti:
#   opened/synchronize → guard + lint/test + versioning bump su Dev
#   closed (merged)    → stable release su main
# ---------------------------------------------------------------------------
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - closed

# ---------------------------------------------------------------------------
# CONCURRENCY — un solo run attivo per PR
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:
  # ===========================================================================
  # JOB -1: OFFICIAL REPO GUARD
  # Blocca il workflow se avviato fuori dalla repository ufficiale o da utenti
  # diversi dal maintainer.
  # ===========================================================================
  official_repo_guard:
    name: Official Repository Guard
    runs-on: ubuntu-latest
    # Gira su tutti i tipi di evento (opened, synchronize, closed/merged)
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    permissions:
      contents: read
    steps:
      - name: Verify Official Repository and Maintainer
        run: |
          if [ "${{ github.repository }}" != "Magnetarman/WinToolkit" ]; then
            echo "::error::Azione non consentita: CI_UpdateWinToolkit_Main è supportata solo nella repository ufficiale https://github.com/Magnetarman/WinToolkit/. Repository corrente: ${{ github[...]
            exit 1
          fi
          if [ "${GITHUB_ACTOR,,}" != "magnetarman" ]; then
            echo "::error::Azione non consentita: il ramo main può essere sincronizzato solo dal maintainer @Magnetarman nella repository ufficiale. Attore corrente: ${{ github.actor }}"
            exit 1
          fi
          echo "Repository e maintainer verificati ✓"

  # ===========================================================================
  # JOB 0: MAIN BRANCH GUARD — Blocco totale contributi esterni
  #
  # Chiude automaticamente qualsiasi PR verso 'main' che non sia aperta
  # dal maintainer (magnetarman) o proveniente da un branch release/v*.
  # ===========================================================================
  main_branch_guard:
    name: Main Branch Authorization Check
    runs-on: ubuntu-latest
    # Solo su opened/synchronize, non al merge
    if: github.event.action != 'closed'
    permissions:
      pull-requests: write
      contents: read
    needs: official_repo_guard

    steps:
      - name: Verify PR Author and Source Branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const author       = context.payload.pull_request.user.login;
            const prNumber     = context.issue.number;
            const headBranch   = context.payload.pull_request.head.ref;
            const isMaintainer = (author.toLowerCase() === 'magnetarman');
            const isReleaseBranch = headBranch.startsWith('release/v');

            if (!isMaintainer) {
              const blockedMessage = [
                `## ⛔ Accesso Negato — Pull Request Chiusa Automaticamente`,
                ``,
                `Ciao @${author},`,
                `grazie per il tuo interesse in WinToolkit!`,
                ``,
                `Purtroppo questa Pull Request è stata **chiusa automaticamente** perché è indirizzata direttamente verso il ramo \`main\`.`,
                ``,
                `### Regole di Contribuzione`,
                ``,
                `- Il ramo \`main\` è **rigidamente protetto** ed è riservato esclusivamente ai rilasci ufficiali e stabili del progetto gestiti dal maintainer.`,
                `- Tutti i contributi esterni, le nuove funzionalità e le correzioni di bug devono essere proposti tramite Pull Request verso il ramo di sviluppo \`Dev\`.`,
                `- Ricorda che i collaboratori esterni possono proporre modifiche **esclusivamente** ai moduli all'interno della cartella \`tool/\`.`,
                ``,
                `### Come procedere`,
                ``,
                `1. **Chiudi** questa PR se non è già chiusa.`,
                `2. **Apri una nuova Pull Request** selezionando il ramo \`Dev\` come base (Target Branch).`,
                `3. Assicurati che le modifiche siano limitate esclusivamente ai file sotto la cartella \`tool/\`.`,
                ``,
                `Grazie per la collaborazione!`,
                ``,
                `---`,
                `*Messaggio automatico del sistema di protezione di WinToolkit — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: blockedMessage,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });

              core.setFailed(
                `PR #${prNumber} chiusa automaticamente: l'utente @${author} non è autorizzato a inviare PR direttamente su 'main'.`
              );
            } else if (!isReleaseBranch) {
              core.warning(
                `PR #${prNumber} autorizzata (maintainer), ma il branch sorgente '${headBranch}' non segue la convenzione release/v*. Procedendo comunque.`
              );
            } else {
              core.info(`PR #${prNumber} autorizzata: maintainer (@${author}), branch release/v* conforme ✓`);
            }

  # ===========================================================================
  # JOB DETECT_CHANGES — Rileva modifiche a file sorgente PS1
  # ===========================================================================
  detect_changes:
    name: Detect Source Changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    needs: main_branch_guard
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for PS1 source changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "File modificati nella PR:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(tool/[^/]+\.ps1|WinToolkit-template\.ps1|start\.ps1|start-offline\.ps1|WinToolkit-GUI\.ps1|compiler\.ps1|\.github/(tests|scripts)/[^/]+\.ps1)$'; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "Modifiche a file sorgente PS1 rilevate."
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica a file sorgente PS1 rilevata."
          fi

  # ===========================================================================
  # JOB 1: LINTING — Analisi statica
  # ===========================================================================
  linting:
    name: Linting
    runs-on: windows-latest
    if: github.event.action != 'closed' && needs.detect_changes.outputs.run_checks == 'true'
    needs: detect_changes
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Write-Host "Installing PSScriptAnalyzer..." -ForegroundColor Yellow
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Lint /tool files
        shell: pwsh
        run: |
          Write-Host "::group::PSScriptAnalyzer — /tool"
          $settingsPath = ".github/linters/PSScriptAnalyzer-settings.psd1"
          $hasErrors = $false
          foreach ($file in (Get-ChildItem -Path "tool" -Filter "*.ps1" -ErrorAction SilentlyContinue)) {
            $analysis = Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath -Severity Error,Warning
            if ($analysis) {
              foreach ($issue in $analysis) {
                $col = if ($issue.Severity -eq 'Error') { 'Red' } else { 'Yellow' }
                Write-Host "  [$($issue.Severity)] $($issue.RuleName): $($issue.Message)" -ForegroundColor $col
                if ($issue.Severity -eq 'Error') { $hasErrors = $true }
              }
            }
          }
          Write-Host "::endgroup::"
          if ($hasErrors) {
            Write-Host "::error::Errori di linting rilevati nei file /tool."
            exit 1
          }

      # NOTE: WinToolkit-template.ps1 is exclusive to the Dev branch
      # and should never exist on Main. Linting of this file occurs only on PR toward Dev,
      # not on PR toward Main. This step has been removed to prevent unnecessary failures.

      - name: Verifica sintassi compiler.ps1
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Path "compiler.ps1" -ErrorAction Stop
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($e in $parseErrors) {
              Write-Host "::error file=compiler.ps1,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::ERRORE DI SINTASSI: $($e.Message)"
            }
            exit 1
          }

  # ===========================================================================
  # JOB 2: TESTING — Suite Pester 5
  # ===========================================================================
  testing:
    name: Pester Tests
    runs-on: windows-latest
    if: github.event.action != 'closed'
    needs: linting
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Pester 5
        shell: pwsh
        run: |
          $installed = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '5.0.0' }
          if (-not $installed) {
            Write-Host "Installing Pester 5..." -ForegroundColor Yellow
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Write-Host "::group::WinToolkit Pester Test Suite"
          $config = New-PesterConfiguration
          $config.Run.Path                = @(
            '.github/tests/WinToolkit.Tests.ps1',
            '.github/tests/Unit',
            '.github/tests/Integration'
          )
          $config.Run.PassThru            = $true
          $config.Output.Verbosity        = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.CodeCoverage.Enabled               = $true
          $config.CodeCoverage.CoveragePercentTarget = 70
          $config.CodeCoverage.Path                  = @('WinToolkit-template.ps1', 'tool/*.ps1')
          $config.CodeCoverage.OutputPath            = 'coverage.xml'
          $config.Filter.ExcludeTag                  = @('Slow')
          $result = Invoke-Pester -Configuration $config
          Write-Host "::endgroup::"

          Write-Host ""
          Write-Host "Risultati Test:" -ForegroundColor Cyan
          Write-Host "  Superati : $($result.PassedCount)"  -ForegroundColor Green
          Write-Host "  Falliti  : $($result.FailedCount)"  -ForegroundColor $(if ($result.FailedCount -gt 0) { 'Red' } else { 'Green' })

          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) test Pester falliti — pipeline bloccata."
            exit 1
          }

  # ===========================================================================
  # JOB 3: VERSIONING BUMP — Ad ogni commit/push su PR release/v* aperta
  #
  # Eseguito dopo testing (o dopo main_branch_guard se i check sono saltati).
  # Bumpa il build number su Dev tramite Update-Version.ps1, verifica sintassi
  # e committa WinToolkit-template.ps1 aggiornato su Dev.
  # NON agisce sul branch release/v*, modifica solo Dev.
  # ===========================================================================
  versioning_bump:
    name: Versioning Bump on Dev
    runs-on: windows-latest
    # Gira solo su PR aperte (opened/synchronize), non al merge
    if: |
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release/v')
    # Dipende da testing se i check sono abilitati, altrimenti da detect_changes
    needs: [detect_changes, testing]
    # Il job è opzionale: se testing è saltato (run_checks=false) lo gestiamo
    # tramite la condizione sul needs — testing ha `if` che lo salta, ma
    # needs.testing non blocca se il job è stato saltato.
    permissions:
      contents: write
      actions: read
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout Dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: Dev

      - name: Bump Version su Dev
        id: version
        shell: pwsh
        run: |
          & .github/scripts/Update-Version.ps1 -TemplatePath "WinToolkit-template.ps1"

      - name: Verifica sintassi template (post-bump)
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Path "WinToolkit-template.ps1"
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "::error file=WinToolkit-template.ps1,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::ERRORE DI SINTASSI: $($e.Message)"
            }
            exit 1
          }
          Write-Host "Template sintassi OK — v${{ steps.version.outputs.new_version }}" -ForegroundColor Green

      - name: Commit Version Bump su Dev
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "🆙 [CI] Bump build number v${{ steps.version.outputs.new_version }} — PR ${{ github.event.pull_request.number }}"
          file_pattern: "WinToolkit-template.ps1"
          branch: Dev
          push_options: "--force-with-lease"
          skip_fetch: true

  # ===========================================================================
  # JOB 4: STABLE RELEASE — Al merge della PR release/v* su main
  #
  # Triggered da: pull_request closed + merged == true + branch release/v*
  # Flusso:
  #   1. Checkout main (appena aggiornato dal merge)
  #   2. Legge metriche da WinToolkit.ps1 compilato
  #   3. Chiama New-ReleaseNotes.ps1
  #   4. Crea release stabile GitHub con tag vX.Y.Z targetata su main
  #      (nessun branch aggiuntivo — solo tag sul commit di merge)
  # ===========================================================================
  stable_release:
    name: Stable Release on Merge
    runs-on: windows-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/v')
    needs: official_repo_guard
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Estrai Versione e Metriche da WinToolkit.ps1
        id: metrics
        shell: pwsh
        run: |
          if (-not (Test-Path "WinToolkit.ps1")) {
            Write-Host "::error::WinToolkit.ps1 non trovato su main dopo il merge."
            exit 1
          }

          # Estrai versione
          $versionLine = Get-Content -Path 'WinToolkit.ps1' | Select-String -Pattern '\$ToolkitVersion\s*=\s*"(.*?)\s*\(Build'
          if (-not $versionLine) {
            Write-Host "::error::Impossibile estrarre la versione da WinToolkit.ps1."
            exit 1
          }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          Write-Host "Versione rilevata: $version"

          # Metriche dimensione
          $outputKB = [math]::Round((Get-Item "WinToolkit.ps1").Length / 1KB, 2)

          # Conta righe totali del compilato
          $totalLines = (Get-Content "WinToolkit.ps1").Count

          # Stima righe sorgente sommando tool/*.ps1 + template
          $sourceLines = 0
          Get-ChildItem -Path "tool" -Filter "*.ps1" -ErrorAction SilentlyContinue | ForEach-Object {
            $sourceLines += (Get-Content $_.FullName).Count
          }
          if (Test-Path "WinToolkit-template.ps1") {
            $sourceLines += (Get-Content "WinToolkit-template.ps1").Count
          }
          $linesRemoved = [math]::Max(0, $sourceLines - $totalLines)

          # Stima KB sorgente
          $sourceBytes = 0
          Get-ChildItem -Path "tool" -Filter "*.ps1" -ErrorAction SilentlyContinue | ForEach-Object {
            $sourceBytes += $_.Length
          }
          if (Test-Path "WinToolkit-template.ps1") {
            $sourceBytes += (Get-Item "WinToolkit-template.ps1").Length
          }
          $sourceKB = [math]::Round($sourceBytes / 1KB, 2)
          $reduction = if ($sourceKB -gt 0) { [math]::Round((($sourceKB - $outputKB) / $sourceKB) * 100, 1) } else { 0 }

          Write-Host "Metriche: sourceKB=$sourceKB, outputKB=$outputKB, reduction=$reduction%, linesRemoved=$linesRemoved"

          echo "VERSION=$version"           >> $env:GITHUB_ENV
          echo "SOURCE_KB=$sourceKB"        >> $env:GITHUB_ENV
          echo "OUTPUT_KB=$outputKB"        >> $env:GITHUB_ENV
          echo "REDUCTION=$reduction"       >> $env:GITHUB_ENV
          echo "LINES_REMOVED=$linesRemoved" >> $env:GITHUB_ENV

      - name: Genera Note di Rilascio
        id: notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .github/scripts/New-ReleaseNotes.ps1 `
            -Version          "${{ env.VERSION }}" `
            -SourceKB         "${{ env.SOURCE_KB }}" `
            -OutputKB         "${{ env.OUTPUT_KB }}" `
            -ReductionPercent "${{ env.REDUCTION }}" `
            -LinesRemoved     "${{ env.LINES_REMOVED }}"

      - name: Crea Release Stabile su GitHub
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ env.VERSION }}"
          if (-not $version -or $version -eq '') {
            Write-Host "::error::Versione vuota — impossibile creare la release."
            exit 1
          }

          # Normalizza tag: "2.5.3" → "v2.5.3"
          $tag = "v$version" -replace ' \(', '-' -replace '\)', '' -replace ' ', ''
          Write-Host "Creazione release stabile: '$version' -> tag '$tag' su main"

           gh release create $tag "WinToolkit.ps1" `
             --title "WinToolkit $tag" `
             --notes-file release_body.md `
             --target main
           # Nota: nessun --prerelease → release stabile
           # Nota: release_body.md contiene commit categorizzati (Bug Fixes, Features, etc.) + statistiche compressione
           # Nota: nessun branch creato → gh release crea solo il tag sul commit HEAD di main

      - name: Generate Release Summary
        shell: pwsh
        run: |
          $summary = @"
          ## Release Stabile — WinToolkit v${{ env.VERSION }}

          | Metrica          | Valore                    |
          |------------------|---------------------------|
          | Peso Sorgente    | ${{ env.SOURCE_KB }} KB   |
          | Peso Finale      | ${{ env.OUTPUT_KB }} KB   |
          | Riduzione        | ${{ env.REDUCTION }}%     |
          | Righe Eliminate  | ${{ env.LINES_REMOVED }}  |

          **Branch**: main | **Workflow**: CI_UpdateWinToolkit_Main | **Stato**: Release stabile pubblicata ✅
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
