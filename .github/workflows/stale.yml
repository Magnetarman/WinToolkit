name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >
            Questa issue è stata marcata come inattiva per mancanza di aggiornamenti negli
            ultimi 60 giorni. Verrà chiusa automaticamente nei prossimi 7 giorni se non
            ci saranno aggiornamenti. Commenta qui per tenerla aperta.
          stale-pr-message: >
            Questa PR è stata marcata come inattiva per mancanza di aggiornamenti negli
            ultimi 60 giorni. Verrà chiusa automaticamente nei prossimi 7 giorni se non
            ci saranno aggiornamenti. Commenta qui per tenerla aperta.
          close-issue-message: 'Chiusa automaticamente per inattività. Riaprire se il problema persiste.'
          close-pr-message: 'Chiusa automaticamente per inattività. Riaprire se la PR è ancora rilevante.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security'
