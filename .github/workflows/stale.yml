name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Step 1 — Gestione standard: tutte le issue/PR ESCLUSE quelle in
      #           milestone "Backlog". Le issue non-Backlog vengono marcate
      #           stale e chiuse dopo 7 giorni di inattività come di consueto.
      # -----------------------------------------------------------------------
      - name: Stale standard (escluse issue Backlog)
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >
            Questa issue è stata marcata come inattiva per mancanza di aggiornamenti negli
            ultimi 60 giorni. Verrà chiusa automaticamente nei prossimi 7 giorni se non
            ci saranno aggiornamenti. Commenta qui per tenerla aperta.
          stale-pr-message: >
            Questa PR è stata marcata come inattiva per mancanza di aggiornamenti negli
            ultimi 60 giorni. Verrà chiusa automaticamente nei prossimi 7 giorni se non
            ci saranno aggiornamenti. Commenta qui per tenerla aperta.
          close-issue-message: "Chiusa automaticamente per inattività. Riaprire se il problema persiste."
          close-pr-message: "Chiusa automaticamente per inattività. Riaprire se la PR è ancora rilevante."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security"
          # Le issue nella milestone "Backlog" (milestone/3) vengono gestite
          # separatamente nello step successivo — qui vengono escluse.
          exempt-issue-milestones: "Backlog"

      # -----------------------------------------------------------------------
      # Step 2 — Issue nella milestone "Backlog" (milestone/3):
      #           vengono marcate come stale dopo 60 giorni, ma NON vengono
      #           MAI chiuse automaticamente (days-before-close: -1).
      #           Le PR non sono coinvolte in questo step.
      # -----------------------------------------------------------------------
      - name: Stale Backlog issues (solo tag, mai chiuse)
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: >
            Questa issue è nel Backlog ed è stata marcata come inattiva per mancanza di
            aggiornamenti negli ultimi 60 giorni. Le issue nel Backlog non vengono chiuse
            automaticamente — verrà mantenuta aperta fino a nuova decisione del team.
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,in-progress"
          only-issue-milestones: "Backlog"
