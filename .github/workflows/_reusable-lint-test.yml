# Reusable lint and test
name: WinToolkit V4.2.0 — Reusable lint and test

on:
  workflow_call:
    inputs:
      run-checks:
        description: Run linting and tests when relevant source files changed.
        required: false
        type: boolean
        default: true
      validate-template:
        description: Include wintoolkit-modules in lint and syntax checks.
        required: false
        type: boolean
        default: true
      validate-start:
        description: Include start-modules and start.ps1 in quality checks.
        required: false
        type: boolean
        default: false
      run-integration-tests:
        description: Run the slower start-core integration build test.
        required: false
        type: boolean
        default: false

jobs:
  linting:
    name: Reusable linting
    if: inputs.run-checks
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PowerShell CI modules
        uses: ./.github/actions/setup-powershell-modules

      - name: Align pipeline version
        id: pipelineVersion
        shell: pwsh
        run: |
          # PIPELINE_VERSION (CI-WinToolkit-Dev.yml) is the single source of truth and
          # the pipeline adapts to it: drift is corrected here, never blocked on. The
          # alignment is byte-level, so the corrected files are already valid for every
          # downstream step of this same run.
          $list = Join-Path $env:RUNNER_TEMP 'pipeline-version-changed.txt'
          & ./.github/scripts/Update-PipelineVersion.ps1 -ChangedFileListPath $list

          $changed = @(if (Test-Path -LiteralPath $list) { Get-Content -LiteralPath $list } else { @() })
          "changed=$($changed.Count -gt 0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($changed) {
            Write-Host "::warning title=Pipeline version::Drift auto-corrected to the canonical PIPELINE_VERSION in $($changed.Count) file(s). The Dev sync job commits the alignment; this run continues with the corrected files."
            $changed | ForEach-Object { Write-Host "  aligned: $_" }
          }

          # Drift must never block the run, but a broken script must: this is the only
          # case that fails here, and it would be a bug in the alignment itself.
          $parseErrors = @()
          Get-ChildItem .github -Recurse -Filter *.ps1 -File | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              if ($errors) { $parseErrors += "$($_.Name): $($errors[0].Message)" }
          }
          if ($parseErrors) { throw "Version alignment produced invalid PowerShell: $($parseErrors -join '; ')" }

      - name: Check fragment spacing
        shell: pwsh
        run: |
          # Source fragments only. The formatter itself refuses every other path,
          # and the compiled artefacts (WinToolkit.ps1, start-core.ps1) are never
          # touched: they are machine-only and must stay compact.
          #
          # Format-FunctionSpacing.ps1 is a local tool — its own contract says it is
          # never invoked by the build pipeline — and what it reports is cosmetic
          # (a trailing blank space, a duplicated blank line). Linting therefore
          # neither fails on it nor annotates it: a whitespace deviation must never
          # show up as a pipeline error or warning. The findings go to the log and to
          # the job summary, and the run stays clean.
          #
          # The formatter is allowed to rewrite the offending files so the list can be
          # read from git (deterministic, and independent of the localized WhatIf
          # text); they are restored on the very next line, so the workspace ends up
          # exactly as checked out and no later step ever sees modified sources.
          #
          # Only the fragment folders actually present are handed to the formatter.
          # On main the checkout holds the compiled artefacts alone (WinToolkit.ps1,
          # start.ps1): the fragments belong to the development section and live on
          # Dev only. The formatter refuses every other path, so a missing folder
          # must skip the step instead of terminating the run.
          $roots = @('start-modules', 'wintoolkit-modules') |
            Where-Object { Test-Path -LiteralPath $_ }

          if (-not $roots) {
            Write-Host 'Fragment spacing: skipped — no source fragment folder in this checkout (compiled artefacts only).' -ForegroundColor Yellow
            return
          }

          # git status --porcelain: two status characters, a space, then the path.
          # "before" is captured first so only the formatter's own writes are undone.
          $before = @(git status --porcelain -- $roots |
            ForEach-Object { $_ -replace '^[\s?!MADRCU]{2}\s+', '' })

          & ./.github/scripts/Format-FunctionSpacing.ps1 -Path $roots -Verbose

          $deviating = @(git status --porcelain -- $roots |
            ForEach-Object { $_ -replace '^[\s?!MADRCU]{2}\s+', '' } |
            Where-Object { $_ -and $before -notcontains $_ })

          if ($deviating) { git checkout -- $deviating }

          if (-not $deviating) {
            Write-Host 'Fragment spacing: every source fragment already complies.' -ForegroundColor Green
            return
          }

          Write-Host "Fragment spacing: $($deviating.Count) fragment(s) would be normalized (informational, not a warning)."
          Write-Host 'Run .\.github\scripts\Format-FunctionSpacing.ps1 locally and commit the result.'
          $deviating | ForEach-Object { Write-Host "  spacing deviation: $_" }

          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              '### Fragment spacing'
              ''
              'Cosmetic deviations. Run `.github/scripts/Format-FunctionSpacing.ps1` locally and commit:'
              ''
            ) + ($deviating | ForEach-Object { "* ``$_``" }) |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Lint PowerShell sources
        shell: pwsh
        env:
          VALIDATE_TEMPLATE: ${{ inputs.validate-template }}
          VALIDATE_START: ${{ inputs.validate-start }}
        run: |
          # The sources are optional in a checkout: main carries the compiled artefacts
          # alone and the module folders belong to the development section on Dev.
          # GitHub prepends $ErrorActionPreference = 'stop' to every pwsh step, so
          # enumerating an absent folder is a terminating error, not a silent one.
          $settingsPath = ".github/linters/PSScriptAnalyzer-settings.psd1"
          $files = @(Get-ChildItem -Path "tools" -Filter "*.ps1" -ErrorAction SilentlyContinue)
          if ($env:VALIDATE_TEMPLATE -eq 'true' -and (Test-Path -LiteralPath "wintoolkit-modules")) {
            $files += @(Get-ChildItem -Path "wintoolkit-modules" -Filter "*.ps1" -File)
          }
          if ($env:VALIDATE_START -eq 'true' -and (Test-Path -LiteralPath "start-modules")) {
            $files += @(Get-ChildItem -Path "start-modules" -Filter "*.ps1" -File)
          }
          if ($env:VALIDATE_START -eq 'true' -and (Test-Path -LiteralPath "start.ps1")) {
            $files += @(Get-Item -LiteralPath "start.ps1")
          }

          if (-not $files) {
            Write-Host 'PSScriptAnalyzer: skipped — no source folder in this checkout (compiled artefacts only).' -ForegroundColor Yellow
            return
          }

          $hasErrors = $false

          foreach ($file in $files) {
            Write-Host "Analyzing: $($file.FullName)" -ForegroundColor Yellow
            $analysis = @(Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath -Severity Error,Warning)
            foreach ($issue in $analysis) {
              $color = if ($issue.Severity -eq 'Error') { 'Red' } else { 'Yellow' }
              Write-Host "  [$($issue.Severity)] $($issue.RuleName): $($issue.Message)" -ForegroundColor $color
              if ($issue.Severity -eq 'Error') { $hasErrors = $true }
            }
            if (-not $analysis) { Write-Host "  OK" -ForegroundColor Green }
          }

          if ($hasErrors) {
            Write-Host "::error::PSScriptAnalyzer found blocking errors."
            exit 1
          }

      - name: Validate tools syntax
        uses: ./.github/actions/validate-syntax
        with:
          path: tools/*.ps1
          label: tools

      - name: Validate core module syntax
        if: inputs.validate-template
        uses: ./.github/actions/validate-syntax
        with:
          path: wintoolkit-modules/*.ps1
          label: wintoolkit-modules

      - name: Validate compiler syntax
        uses: ./.github/actions/validate-syntax
        with:
          path: compiler.ps1
          label: compiler.ps1

      - name: Validate start-modules syntax
        if: inputs.validate-start
        uses: ./.github/actions/validate-syntax
        with:
          path: start-modules/*.ps1
          label: start-modules

      - name: Validate launcher stub ASCII purity
        if: inputs.validate-start
        shell: pwsh
        run: |
          # The contract is about the launcher stub: a thin, ASCII-only loader that
          # locates PowerShell 7 and pulls start-core.ps1 (see .github/Docs/ARCHITECTURE.md).
          # That stub only exists in a development tree. In an artifacts-only checkout
          # start.ps1 is the published script of the previous release, which is a full
          # localized installer by design, so the stub contract does not apply to it.
          # The gate therefore runs where the stub is developed and is skipped elsewhere,
          # instead of being applied to a file it was never written for.
          if (-not (Test-Path -LiteralPath 'start-modules')) {
            Write-Host 'Launcher stub ASCII purity: skipped — start.ps1 is the published artefact here, not the stub (no start-modules source tree).' -ForegroundColor Yellow
            return
          }

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'start.ps1'))
          if ($bytes | Where-Object { $_ -gt 127 }) {
            Write-Host '::error file=start.ps1::Launcher stub must remain ASCII-only.'
            exit 1
          }

      - name: Start fragment acceptance gate
        shell: pwsh
        run: |
          # The acceptance gate of the start fragments: ordered-concatenation parse,
          # no duplicate definitions, no local variable read before assignment,
          # PSScriptAnalyzer and the compiled artefact. It used to be a local-only
          # tool, which is how a $wingetReady-style defect reached the compiled
          # script unnoticed: the tests never execute the orchestrator. Here it is
          # enforced on every run.
          #
          # -SkipTests: the fragment suites already run in the "testing" job, so
          # they are not executed twice.
          #
          # The gate consumes the fragments and rebuilds start-core.ps1, so it has
          # nothing to gate where they are absent: on main the checkout holds the
          # compiled artefacts only and the fragments live on Dev. The script exits
          # terminating on the missing folder (ErrorActionPreference = Stop), which
          # would fail the whole job instead of skipping it.
          if (-not (Test-Path -LiteralPath 'start-modules')) {
            Write-Host 'Start fragment acceptance gate: skipped — start-modules is not part of this checkout (compiled artefacts only).' -ForegroundColor Yellow
            return
          }

          & pwsh -NoProfile -File ./.github/scripts/Test-StartFragmentGate.ps1 -SkipTests
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::The start-modules acceptance gate failed; see the log for the failing section.'
            exit $LASTEXITCODE
          }

  testing:
    name: Reusable Pester tests
    if: inputs.run-checks
    runs-on: windows-latest
    needs: linting
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PowerShell CI modules
        uses: ./.github/actions/setup-powershell-modules

      - name: Run Pester test suites
        shell: pwsh
        env:
          VALIDATE_START: ${{ inputs.validate-start }}
          RUN_INTEGRATION_TESTS: ${{ inputs.run-integration-tests }}
        run: |
          # PSScriptAnalyzer already ran in the 'linting' job; skip here.
          #
          # Every suite loads the module sources through the repository root, so a
          # suite is collected only when the folder it reads is part of the checkout.
          # On main the compiled artefacts stand alone and those folders live on Dev:
          # loading them there is not a missing test, it is a suite that cannot run.
          $requiredFolders = @(
            @{ Path = '.github/tests/CI-Smoke.Tests.ps1';                 Root = 'wintoolkit-modules' },
            @{ Path = '.github/tests/Unit/Tools.Contract.Tests.ps1';       Root = 'tools' },
            @{ Path = '.github/tests/Unit/WinDeleteUserProfiles.Tests.ps1'; Root = 'tools' }
          )
          $suitePaths = @(
            $requiredFolders |
              Where-Object { Test-Path -LiteralPath $_.Root } |
              ForEach-Object { $_.Path }
          )
          $skippedSuites = @(
            $requiredFolders |
              Where-Object { -not (Test-Path -LiteralPath $_.Root) } |
              ForEach-Object { "$($_.Path) (needs $($_.Root))" }
          )
          if ($skippedSuites) {
            Write-Host "Pester suites skipped, source folder not in this checkout: $($skippedSuites -join '; ')" -ForegroundColor Yellow
          }

          if ($suitePaths) {
            $config = New-PesterConfiguration
            $config.Run.Path                = $suitePaths
            $config.Run.PassThru            = $true
            $config.Output.Verbosity        = 'Detailed'
            $config.TestResult.Enabled      = $true
            $config.TestResult.OutputPath   = 'TestResults.xml'
            $config.TestResult.OutputFormat = 'NUnitXml'
            $result = Invoke-Pester -Configuration $config

            if ($result.FailedCount -gt 0) {
              Write-Host "::error::$($result.FailedCount) Pester test(s) failed."
              exit 1
            }
          }

          if ($env:VALIDATE_START -eq 'true' -and (Test-Path -LiteralPath 'start-modules')) {
            $startConfig = New-PesterConfiguration
            $startPaths = @(
              '.github/tests/StartModules/StartModules.Syntax.Tests.ps1',
              '.github/tests/StartModules/StartModules.Common.Tests.ps1',
              '.github/tests/StartModules/StartModules.Localization.Tests.ps1',
              '.github/tests/StartModules/StartModules.Winget.Tests.ps1'
            )
            if ($env:RUN_INTEGRATION_TESTS -eq 'true') {
              $startPaths += '.github/tests/Integration/BuildStart.Tests.ps1'
            }
            $startConfig.Run.Path = $startPaths
            $startConfig.Run.PassThru = $true
            $startConfig.Output.Verbosity = 'Detailed'
            $startConfig.TestResult.Enabled = $true
            $startConfig.TestResult.OutputPath = 'TestResults-Start.xml'
            $startConfig.TestResult.OutputFormat = 'NUnitXml'
            $startResult = Invoke-Pester -Configuration $startConfig
            if ($startResult.FailedCount -gt 0) {
              Write-Host "::error::$($startResult.FailedCount) StartModules Pester test(s) failed."
              exit 1
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reusable-pester-test-results
          path: |
            TestResults.xml
            TestResults-Start.xml
          if-no-files-found: ignore
          retention-days: 30
