# WinToolkit CI Dev Pipeline V4.1.0
# Triggers: push to Dev and to every tagged working branch -> lint+test+build; PR to Dev -> lint+test only.
# Build regenerates WinToolkit.ps1 from pure sources (pre-existing file removed first). AST-validated before compile.

name: WinToolkit — CI Dev Pipeline V4.1.0

env:
  # SINGLE SOURCE OF TRUTH for the CI/CD pipeline version.
  # Edit this value, then the sync-pipeline-version job rewrites the version
  # token in every workflow and composite action (and commits the result).
  PIPELINE_VERSION: "4.1.1"
  # Force Node 24 in Actions to avoid GitHub warnings about deprecated versions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Triggers: Dev + every tagged working branch (push); PRs to Dev.
on:
  push:
    # ONE RULE, applied to every supported tag: <TAG>, then `-` or `/`, then any
    # name at any nesting depth. Case-insensitive via the per-letter classes.
    #
    # `**` is what makes it general. The single `*` used before stopped at the
    # first `/`, so `BUG-Pipeline-CI/CD-...` matched neither `BUG/*` (it wants the
    # slash right after BUG) nor `BUG-*` (its `*` dies at `BUG-Pipeline-CI`) and
    # the branch was invisible to the pipeline: no run at all, no error either.
    #
    # Tags: BUG, ENHANCEMENT, FEATURE(S), FEAT, FIX, HOTFIX + GUI and Changes,
    # which PR_And_PullRequest.md documents as supported but the trigger missed.
    branches:
      - Dev
      - "[Bb][Uu][Gg]-**"
      - "[Bb][Uu][Gg]/**"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]-**"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]/**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]-**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss]-**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss]/**"
      - "[Ff][Ee][Aa][Tt]-**"
      - "[Ff][Ee][Aa][Tt]/**"
      - "[Ff][Ii][Xx]-**"
      - "[Ff][Ii][Xx]/**"
      - "[Hh][Oo][Tt][Ff][Ii][Xx]-**"
      - "[Hh][Oo][Tt][Ff][Ii][Xx]/**"
      - "[Gg][Uu][Ii]-**"
      - "[Gg][Uu][Ii]/**"
      - "[Cc][Hh][Aa][Nn][Gg][Ee][Ss]-**"
      - "[Cc][Hh][Aa][Nn][Gg][Ee][Ss]/**"
    # Same rule on the file side: `*` stops at `/`, so a fragment in a subdirectory
    # would have started no run at all.
    #
    # `dir/**/*.yml` alone is NOT enough: `**` already consumes the separator, so a
    # file sitting directly in `dir` does not match it. Both forms are listed, or
    # editing a top-level workflow would silently stop triggering the pipeline.
    paths:
      - "tools/**"
      - "wintoolkit-modules/**"
      - "WinToolkit_GUI.ps1"
      - "compiler.ps1"
      - "start.ps1"
      - "start-modules/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/**/*.yml"
      - ".github/actions/**"
      - ".github/tests/*.ps1"
      - ".github/tests/**/*.ps1"
      - ".github/scripts/**"
  pull_request:
    branches: [Dev]

# Single active run per branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR Security Guard (PRs to Dev only): L1 tools/start-modules (silent), L2 sensitive (warning), L3 protected (block+close).
  pr_security_guard:
    name: PR Security
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify changed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const author       = context.payload.pull_request.user.login;
            const prNumber     = context.issue.number;
            const isMaintainer = (author.toLowerCase() === 'magnetarman');

            // File classification: L1 tools/start-modules (silent), L2 sensitive+assets (warning), L3 else (block).

            const SENSITIVE_FILES = new Set([
              'start.ps1',
              'WinToolkit_GUI.ps1',
              'wintoolkit-modules/',
            ]);

            const BUILD_ARTIFACTS = new Set([
              'WinToolkit.ps1',
              'start-core.ps1',
            ]);

            function classifyFile(filename) {
              if (filename.startsWith('tools/'))         return 1; // allowed
              if (filename.startsWith('start-modules/')) return 1; // allowed
              if (SENSITIVE_FILES.has(filename))         return 2; // sensitive
              if (filename.startsWith('assets/'))        return 2; // sensitive
              if (filename.startsWith('wintoolkit-modules/')) return 2; // sensitive (framework core)
              return 3;                                            // protected
            }

            let level2Files = files.filter(f => classifyFile(f.filename) === 2);
            let level3Files = files.filter(f => classifyFile(f.filename) === 3);

            // Maintainer bypass: L3 downgraded to L2.
            if (isMaintainer && level3Files.length > 0) {
              level2Files = [...level2Files, ...level3Files];
              level3Files = [];
            }

            // Compiled artifacts (WinToolkit.ps1, start-core.ps1) are silent for maintainer.
            if (isMaintainer) {
              level2Files = level2Files.filter(f => !BUILD_ARTIFACTS.has(f.filename));
            }

            // L3: hard block
            if (level3Files.length > 0) {
              const fileList = level3Files.map(f => `- \`${f.filename}\``).join('\n');

              const blockedMessage = [
                `## ⛔ Access Denied — Pull Request Closed Automatically`,
                ``,
                `Hi @${author},`,
                `thanks for your interest in WinToolkit! Unfortunately this PR was **closed automatically** because it includes changes to protected core files.`,
                ``,
                `### Protected files detected`,
                ``,
                fileList,
                ``,
                `### Contribution rule`,
                ``,
                `External contributors may propose changes **exclusively** to the modules inside the \`tools/\` and \`start-modules/\` directories.`,
                `Core files (compiler, CI/CD workflows, build scripts, configuration) are managed directly by the maintainer to guarantee project stability.`,
                ``,
                `### How to proceed`,
                ``,
                `1. **Restore** the protected files to their original state in your fork.`,
                `2. **Limit** your changes to files inside \`tools/\` or \`start-modules/\`.`,
                `3. **Open a new PR** containing only the module changes.`,
                ``,
                `If you believe a change to core files is necessary, please open an **Issue** describing your proposal instead: it will be reviewed by the maintainer.`,
                ``,
                `---`,
                `*Automated message from the WinToolkit CI/CD system — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: blockedMessage,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });
              core.setFailed(
                `PR #${prNumber} closed: it contains changes to ${level3Files.length} protected file(s) outside /tools and /start-modules.`
              );
              return;
            }

            // L2: warning
            if (level2Files.length > 0) {
              const fileList = level2Files.map(f => `- \`${f.filename}\``).join('\n');

              const warningMessage = [
                `## 👀 Heads Up — Manual Review Required`,
                ``,
                `Hi @${author},`,
                `thanks for your contribution! This PR was **accepted** and can proceed normally through the review flow.`,
                ``,
                `However, the automated check detected that one or more **sensitive** WinToolkit files were modified, which affect the user interface, the main template or the project's static resources:`,
                ``,
                `### Sensitive files modified`,
                ``,
                fileList,
                ``,
                `### Why this notice?`,
                ``,
                `These files are not blocked for contributors, but they require **additional verification** by the maintainer before merging, because unexpected changes could:`,
                ``,
                `- Alter the interface behaviour (\`WinToolkit_GUI.ps1\`, \`start.ps1\`)`,
                `- Impact compilation or the framework core functions (\`wintoolkit-modules/\`)`,
                `- Introduce unverified resources into the distribution (\`assets/\`)`,
                ``,
                `### Next steps`,
                ``,
                `No action is required from you. The maintainer will review the changes with extra care before merging.`,
                ``,
                `---`,
                `*Automated notification from the WinToolkit CI/CD system — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: warningMessage,
              });

              // Notice in Actions log (non-failing)
              core.notice(
                `PR #${prNumber}: ${level2Files.length} sensitive file(s) modified ` +
                `(${level2Files.map(f => f.filename).join(', ')}) — manual review recommended.`
              );
            }

  # Differential change detection per source family (WinToolkit / Start). Each
  # changed file is classified by the artifact it can influence, so a start-modules
  # edit builds start-core.ps1 and never WinToolkit.ps1.
  detect_changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      wintoolkit_changed: ${{ steps.filter.outputs.wintoolkit_changed }}
      start_changed: ${{ steps.filter.outputs.start_changed }}
      start_build_changed: ${{ steps.filter.outputs.start_build_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Differential detection, one family at a time.
          #
          # Each changed file is classified on its own, and the FIRST matching case
          # wins, so a file can never be counted for both families by accident. There
          # is no blanket "shared files activate everything" rule any more: it
          # switched on the WinToolkit build for a StartModules test and left
          # start_build_changed false, so a start-modules edit rebuilt WinToolkit.ps1
          # and shipped a stale start-core.ps1.
          #
          #   wintoolkit_changed  -> lint PSScriptAnalyzer/template + build WinToolkit.ps1
          #   start_changed       -> lint/validate/Pester on start-modules
          #   start_build_changed -> build start-core.ps1
          #
          # Compiled artifacts (WinToolkit.ps1, start-core.ps1) match no case: they
          # are the OUTPUT of a build, and the commit that produces them must never
          # schedule another one.

          WT_CHANGED=false
          ST_CHANGED=false
          ST_BUILD_CHANGED=false

          classify() {
            case "$1" in
              # --- WinToolkit sources, compiled into WinToolkit.ps1 ---
              tools/*.ps1|wintoolkit-modules/*.ps1|WinToolkit_GUI.ps1|compiler.ps1)
                WT_CHANGED=true ;;

              # --- Start sources ---
              # start.ps1 is only the launcher stub: it points at start-core.ps1,
              # it does not become part of it, so it is verified but not compiled.
              start.ps1) ST_CHANGED=true ;;
              start-modules/*.ps1) ST_CHANGED=true; ST_BUILD_CHANGED=true ;;

              # --- CI files that change what the WinToolkit build produces ---
              .github/scripts/Invoke-Build.ps1| \
              .github/scripts/Minify-Source.ps1| \
              .github/scripts/New-WinToolkitCoreScript.ps1| \
              .github/scripts/Test-CompiledScript.ps1)
                WT_CHANGED=true ;;

              # --- CI files that change what the start-core build produces ---
              .github/scripts/Invoke-Build-Start.ps1| \
              .github/scripts/Test-CompiledStartScript.ps1| \
              .github/scripts/Test-StartFragmentGate.ps1)
                ST_CHANGED=true; ST_BUILD_CHANGED=true ;;

              # --- Suites owned by a family: they change what is verified ---
              .github/tests/StartModules/*.ps1|.github/tests/Integration/BuildStart.Tests.ps1)
                ST_CHANGED=true ;;
              .github/tests/Unit/*.ps1| \
              .github/tests/CI-Smoke.Tests.ps1| \
              .github/tests/WinToolkit.Tests.ps1| \
              .github/tests/Integration/Build.Tests.ps1)
                WT_CHANGED=true ;;

              # --- CI infrastructure shared by both families ---
              # Composite actions and any other pipeline script gate the run but are
              # not inputs of either artifact: both families are verified, neither
              # is rebuilt. A script added later lands here by default instead of
              # silently activating nothing.
              .github/actions/*|.github/scripts/*)
                WT_CHANGED=true; ST_CHANGED=true ;;
            esac
          }

          while IFS= read -r changed_file; do
            if [ -n "$changed_file" ]; then classify "$changed_file"; fi
          done <<< "$CHANGED"

          if [ "$WT_CHANGED" = "true" ] || [ "$ST_CHANGED" = "true" ]; then
            RUN_CHECKS=true
          else
            RUN_CHECKS=false
          fi

          {
            echo "run_checks=$RUN_CHECKS"
            echo "wintoolkit_changed=$WT_CHANGED"
            echo "start_changed=$ST_CHANGED"
            echo "start_build_changed=$ST_BUILD_CHANGED"
          } >> "$GITHUB_OUTPUT"

          echo "run_checks=$RUN_CHECKS wintoolkit_changed=$WT_CHANGED start_changed=$ST_CHANGED start_build_changed=$ST_BUILD_CHANGED"

  # Quality gate (lint+test) via reusable workflow; checks enabled per changed family.
  quality:
    name: Lint and test
    needs: detect_changes
    uses: ./.github/workflows/_reusable-lint-test.yml
    with:
      run-checks: ${{ needs.detect_changes.outputs.run_checks == 'true' }}
      validate-template: ${{ needs.detect_changes.outputs.wintoolkit_changed == 'true' }}
      validate-start: ${{ needs.detect_changes.outputs.start_changed == 'true' }}
    permissions:
      contents: read

  # Propagates PIPELINE_VERSION (the single source of truth) to every workflow and
  # action name, then commits the alignment.
  #
  # It runs on EVERY CI branch, not only on Dev: the version is bumped on the
  # working branch, so a Dev-only job left the whole .github tree one version
  # behind and the drift was never committed anywhere.
  #
  # It also runs AFTER both builds. They all push to the same branch, and the
  # alignment commit is a force-with-lease push from a checkout taken before the
  # builds ran: starting in parallel, it raced them, lost, and dropped the
  # alignment silently. always() keeps it running when a build is skipped.
  sync-pipeline-version:
    name: Sync pipeline version
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.detect_changes.result == 'success'
    needs: [detect_changes, quality, build, build-start]
    uses: ./.github/workflows/_reusable-pipeline-version.yml
    with:
      branch: ${{ github.ref_name }}
      commit-message: "🆙 Sync pipeline version"
    secrets: inherit

  # Build WinToolkit.ps1 (reusable workflow) when sources changed and quality passed.
  build:
    name: Build
    if: |
      github.event_name == 'push' &&
      needs.detect_changes.outputs.wintoolkit_changed == 'true' &&
      needs.quality.result == 'success'
    needs: [detect_changes, quality]
    uses: ./.github/workflows/_reusable-build-wintoolkit.yml
    with:
      branch: ${{ github.ref_name }}
      minify: true
      commit-message: "✅ Build WinToolkit"
    secrets: inherit

  # Build start-core.ps1 when start-modules/ changed.
  build-start:
    name: Build start-core
    if: |
      github.event_name == 'push' &&
      needs.detect_changes.outputs.start_build_changed == 'true' &&
      needs.quality.result == 'success'
    needs: [detect_changes, quality]
    uses: ./.github/workflows/_reusable-build-start.yml
    with:
      branch: ${{ github.ref_name }}
      commit-message: "✅ Build start-core.ps1"
    secrets: inherit
