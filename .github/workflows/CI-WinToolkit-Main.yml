# WinToolkit CI Main Protection V4.0.2
# Triggers: PR to main. opened/synced -> guard+lint+version bump on Dev; merged release/v* -> stable GitHub release (tag vX.Y.Z). Maintainer-only.

name: WinToolkit — CI Main Protection V4.0.2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Triggers on PRs to main: opened, synchronize, closed(merged).
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - closed

# Single active run per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Official repo guard: blocks non-maintainer / non-official-repo.
  official_repo_guard:
    name: Official repo guard
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    permissions:
      contents: read
    steps:
      - name: Verify repo & maintainer
        run: |
          if [ "${{ github.repository }}" != "Magnetarman/WinToolkit" ]; then
            echo "::error::Action not allowed: CI-WinToolkit-Main is supported only in the official repository https://github.com/Magnetarman/WinToolkit/. Current repository: ${{ github.repository }}"
            exit 1
          fi
          if [ "${GITHUB_ACTOR,,}" != "magnetarman" ]; then
            echo "::error::Action not allowed: the main branch can be synchronized only by the maintainer @Magnetarman in the official repository. Current actor: ${{ github.actor }}"
            exit 1
          fi
          echo "Repository and maintainer verified ✓"

  # Main branch guard: hard-block PRs to main not from maintainer or not from release/v*.
  main_branch_guard:
    name: Main branch guard
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      pull-requests: write
      contents: read
    needs: official_repo_guard

    steps:
      - name: Verify PR author & branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const author       = context.payload.pull_request.user.login;
            const prNumber     = context.issue.number;
            const headBranch   = context.payload.pull_request.head.ref;
            const isMaintainer = (author.toLowerCase() === 'magnetarman');
            const isReleaseBranch = headBranch.startsWith('release/v');

            if (!isMaintainer) {
              const blockedMessage = [
                `## ⛔ Access Denied — Pull Request Closed Automatically`,
                ``,
                `Hi @${author},`,
                `thanks for your interest in WinToolkit!`,
                ``,
                `Unfortunately this Pull Request was **closed automatically** because it targets the \`main\` branch directly.`,
                ``,
                `### Contribution Rules`,
                ``,
                `- The \`main\` branch is **strictly protected** and is reserved exclusively for the official, stable project releases managed by the maintainer.`,
                `- All external contributions, new features and bug fixes must be proposed through a Pull Request toward the \`Dev\` development branch.`,
                `- Remember that external contributors may propose changes **exclusively** to the modules inside the \`tools/\` and \`start-modules/\` directories.`,
                ``,
                `### How to proceed`,
                ``,
                `1. **Close** this PR if it is not already closed.`,
                `2. **Open a new Pull Request** selecting the \`Dev\` branch as the base (Target Branch).`,
                `3. Make sure your changes are limited exclusively to files under \`tools/\` or \`start-modules/\`.`,
                ``,
                `Thanks for your cooperation!`,
                ``,
                `---`,
                `*Automated message from the WinToolkit protection system — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: blockedMessage,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });

              core.setFailed(
                `PR #${prNumber} closed automatically: user @${author} is not authorized to open PRs directly against 'main'.`
              );
            } else if (!isReleaseBranch) {
              core.warning(
                `PR #${prNumber} authorized (maintainer), but source branch '${headBranch}' does not follow the release/v* convention. Proceeding anyway.`
              );
            } else {
              core.info(`PR #${prNumber} authorized: maintainer (@${author}), release/v* branch compliant ✓`);
            }

  # Differential change detection (WinToolkit / Start). Same patterns as Dev workflow.
  detect_changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    needs: main_branch_guard
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      wintoolkit_changed: ${{ steps.filter.outputs.wintoolkit_changed }}
      start_changed: ${{ steps.filter.outputs.start_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "Files changed in the PR:"
          echo "$CHANGED"

          # Per-family patterns
          WT_PATTERN='^(tools/[^/]+\.ps1|wintoolkit-modules/[^/]+\.ps1|WinToolkit_GUI\.ps1|compiler\.ps1)$'
          ST_PATTERN='^(start\.ps1|start-modules/[0-9]{2}-(Skeleton|Module)\.[A-Za-z]+\.ps1|\.github/scripts/(Invoke-Build-Start|Test-CompiledStartScript)\.ps1)$'
          SHARED_PATTERN='^\.github/(tests/.*\.ps1|scripts/[^/]+\.ps1|actions/.+)$'

          WT_CHANGED=false
          ST_CHANGED=false

          if echo "$CHANGED" | grep -qE "$WT_PATTERN"; then WT_CHANGED=true; fi
          if echo "$CHANGED" | grep -qE "$ST_PATTERN"; then ST_CHANGED=true; fi

          # Shared CI files activate both families
          if echo "$CHANGED" | grep -qE "$SHARED_PATTERN"; then
            WT_CHANGED=true
            ST_CHANGED=true
          fi

          if [ "$WT_CHANGED" = "true" ] || [ "$ST_CHANGED" = "true" ]; then
            RUN_CHECKS=true
          else
            RUN_CHECKS=false
          fi

          {
            echo "run_checks=$RUN_CHECKS"
            echo "wintoolkit_changed=$WT_CHANGED"
            echo "start_changed=$ST_CHANGED"
          } >> "$GITHUB_OUTPUT"

          echo "run_checks=$RUN_CHECKS wintoolkit_changed=$WT_CHANGED start_changed=$ST_CHANGED"

  # Quality gate (lint+test) via reusable workflow.
  quality:
    name: Lint and test
    if: github.event.action != 'closed'
    needs: detect_changes
    uses: ./.github/workflows/_reusable-lint-test.yml
    with:
      run-checks: ${{ needs.detect_changes.outputs.run_checks == 'true' }}
      validate-template: ${{ needs.detect_changes.outputs.wintoolkit_changed == 'true' }}
      validate-start: ${{ needs.detect_changes.outputs.start_changed == 'true' }}
      run-integration-tests: true
    permissions:
      contents: read

  # Version bump on Dev via Update-Version.ps1 when release/v* PR quality passed/skipped.
  versioning_bump:
    name: Versioning bump
    if: |
      always() &&
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release/v') &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    needs: [detect_changes, quality]
    uses: ./.github/workflows/_reusable-versioning.yml
    with:
      target-branch: Dev
      commit-message: "🆙 [CI] Bump build number — PR ${{ github.event.pull_request.number }}"
    secrets: inherit

  # Stable release on merge: extract metrics, generate notes, publish GitHub release with tag on main.
  stable_release:
    name: Stable release
    runs-on: windows-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/v')
    needs: official_repo_guard
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Extract version & metrics
        id: metrics
        shell: pwsh
        run: |
          if (-not (Test-Path "WinToolkit.ps1")) {
            Write-Host "::error::WinToolkit.ps1 not found on main after the merge."
            exit 1
          }

          # Extract version
          $versionLine = Get-Content -Path 'WinToolkit.ps1' | Select-String -Pattern '\$ToolkitVersion\s*=\s*"(.*?)\s*\(Build'
          if (-not $versionLine) {
            Write-Host "::error::Unable to extract the version from WinToolkit.ps1."
            exit 1
          }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          Write-Host "Detected version: $version"

          # Size metrics
          $outputKB = [math]::Round((Get-Item "WinToolkit.ps1").Length / 1KB, 2)

          # Total lines in compiled artifact
          $totalLines = (Get-Content "WinToolkit.ps1").Count

          # Source lines (tools/ + wintoolkit-modules/)
          $sourceLines = 0
          Get-ChildItem -Path "tools" -Filter "*.ps1" -ErrorAction SilentlyContinue | ForEach-Object {
            $sourceLines += (Get-Content $_.FullName).Count
          }
          if (Test-Path "wintoolkit-modules") {
            $sourceLines += (Get-ChildItem -Path "wintoolkit-modules" -Filter "*.ps1" -File | ForEach-Object {
              (Get-Content $_.FullName).Count
            } | Measure-Object -Sum).Sum
          }
          $linesRemoved = [math]::Max(0, $sourceLines - $totalLines)

          # Source size in KB
          $sourceBytes = 0
          Get-ChildItem -Path "tools" -Filter "*.ps1" -ErrorAction SilentlyContinue | ForEach-Object {
            $sourceBytes += $_.Length
          }
          if (Test-Path "wintoolkit-modules") {
            $sourceBytes += (Get-ChildItem -Path "wintoolkit-modules" -Filter "*.ps1" -File | ForEach-Object {
              $_.Length
            } | Measure-Object -Sum).Sum
          }
          $sourceKB = [math]::Round($sourceBytes / 1KB, 2)
          $reduction = if ($sourceKB -gt 0) { [math]::Round((($sourceKB - $outputKB) / $sourceKB) * 100, 1) } else { 0 }

          Write-Host "Metrics: sourceKB=$sourceKB, outputKB=$outputKB, reduction=$reduction%, linesRemoved=$linesRemoved"

          echo "VERSION=$version"           >> $env:GITHUB_ENV
          echo "SOURCE_KB=$sourceKB"        >> $env:GITHUB_ENV
          echo "OUTPUT_KB=$outputKB"        >> $env:GITHUB_ENV
          echo "REDUCTION=$reduction"       >> $env:GITHUB_ENV
          echo "LINES_REMOVED=$linesRemoved" >> $env:GITHUB_ENV

      - name: Generate release notes
        id: notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .github/scripts/New-ReleaseNotes.ps1 `
            -Version          "${{ env.VERSION }}" `
            -SourceKB         "${{ env.SOURCE_KB }}" `
            -OutputKB         "${{ env.OUTPUT_KB }}" `
            -ReductionPercent "${{ env.REDUCTION }}" `
            -LinesRemoved     "${{ env.LINES_REMOVED }}"

      - name: Create stable release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ env.VERSION }}"
          if (-not $version -or $version -eq '') {
            Write-Host "::error::Empty version -- cannot create the release."
            exit 1
          }

          # Normalize tag: "2.5.3" -> "v2.5.3"
          $tag = "v$version" -replace ' \(', '-' -replace '\)', '' -replace ' ', ''
          Write-Host "Creating stable release: '$version' -> tag '$tag' on main"

           gh release create $tag "WinToolkit.ps1" `
             --title "WinToolkit $tag" `
             --notes-file release_body.md `
             --target main
             # stable release; no --prerelease; release_body.md has categorized commits + compression stats

      - name: Release summary
        shell: pwsh
        run: |
          $summary = @"
          ## Stable Release — WinToolkit v${{ env.VERSION }}

          | Metric           | Value                     |
          |------------------|---------------------------|
          | Source size      | ${{ env.SOURCE_KB }} KB   |
          | Final size       | ${{ env.OUTPUT_KB }} KB   |
          | Reduction        | ${{ env.REDUCTION }}%     |
          | Lines removed    | ${{ env.LINES_REMOVED }}  |

          **Branch**: main | **Workflow**: CI-WinToolkit-Main | **Status**: Stable release published ✅
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
