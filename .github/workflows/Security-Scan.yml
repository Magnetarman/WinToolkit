# PowerShell security analysis via PSScriptAnalyzer
name: WinToolkit — Security Scan V4.0.2

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
    schedule:
      - cron: "0 0 * * 1"

jobs:
  security-scan:
    name: PowerShell security analysis
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.21.0

      - name: Run security analysis
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -Settings .github/linters/PSScriptAnalyzer-settings.psd1 `
            -IncludeRule PSAvoidUsingConvertToSecureStringWithPlainText,
                         PSAvoidUsingPlainTextForPassword,
                         PSAvoidUsingUsernameAndPasswordParams,
                         PSAvoidUsingInvokeExpression,
                         PSAvoidUsingWriteHost,
                         PSUseShouldProcessForStateChangingFunctions

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Output "::warning::Found $($results.Count) security issue(s)."
          } else {
            Write-Output "No security issues detected."
          }

      - name: Fail on critical errors
        shell: pwsh
        run: |
          $errors = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Error `
            -IncludeRule PSAvoidUsingConvertToSecureStringWithPlainText,
                         PSAvoidUsingPlainTextForPassword,
                         PSAvoidUsingUsernameAndPasswordParams,
                         PSAvoidUsingInvokeExpression

          if ($errors) {
            $errors | Format-Table -AutoSize
            throw "Detected $($errors.Count) critical security error(s). Build blocked."
          }
