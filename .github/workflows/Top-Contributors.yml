# =============================================================================
# WinToolkit — Top Contributors V4.0.2
# =============================================================================
# Automatically updates the "Top 10 Contributors" section in the README on main
# by analyzing commits and PRs on the Dev branch.
#
# TRIGGER:
#   - schedule: Every Monday at 04:00 UTC (06:00 CEST / 05:00 CET).
#     The script verifies the Europe/Rome timezone at runtime and proceeds only
#     if the Italian time is within the 05:00-07:00 window, automatically
#     handling the CET/CEST transition.
#   - workflow_dispatch: Manual execution, limited to admin/maintainer.
#
# FLOW:
#   Job 0 -- validate:    Verifies official repo and admin permissions
#   Job 1 -- update:      Calculates rankings, updates README, creates/updates PR
#
# BRANCH PROTECTION:
#   The main branch HAS active branch protection. Direct push is BLOCKED,
#   so creating a Pull Request is MANDATORY, not optional.
#   The token configured in the repo is used (GITHUB_TOKEN with fallback to
#   RELEASE_AUTOMATION_TOKEN, consistent with existing pipelines).
#   If protection is changed in the future, the PR logic remains valid.
#
# RUNTIME: PowerShell 7+ (pwsh) preinstalled on ubuntu-latest
# =============================================================================

name: WinToolkit — Top Contributors V4.0.2

on:
  schedule:
    # Every Monday at 04:00 UTC.
    # Corresponds to 06:00 CEST (daylight saving) and 05:00 CET (standard).
    # The script performs a runtime check on Europe/Rome to automatically
    # handle the CET/CEST transition and proceeds only if Italian time
    # is within the 05:00-07:00 window.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: top-contributors
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # JOB 0: VALIDATE
  # Verifies official repository and admin/maintainer permissions.
  # ===========================================================================
  validate:
    name: Validate Repository and Permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Verify Official Repository
        run: |
          if [ "${{ github.repository }}" != "Magnetarman/WinToolkit" ]; then
            echo "::error::Action not allowed: supported only in the official repository https://github.com/Magnetarman/WinToolkit/. Current: ${{ github.repository }}"
            exit 1
          fi
          echo "Official repository verified"
      
      - name: Verify Admin or Maintainer Permission
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const username = context.actor;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: username
            });
            
            const level = permission.data.permission;
            if (level !== 'admin' && level !== 'maintain') {
              core.setFailed(`User @${username} does not have admin/maintainer permissions (current: ${level}). This workflow can only be triggered by admins or maintainers.`);
            } else {
              core.info(`Permission verified: @${username} has '${level}' access`);
            }
      
      - name: Skip Permission Check for Scheduled Runs
        if: github.event_name == 'schedule'
        run: echo "Scheduled run — permission check skipped"

  # ===========================================================================
  # JOB 1: UPDATE CONTRIBUTORS
  # Runs the PowerShell script that calculates rankings and updates the README.
  # ===========================================================================
  update-contributors:
    name: Update Top Contributors
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main
      
      - name: Run Top Contributors Script
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          & .github/scripts/Get-TopContributors.ps1 `
            -GitHubToken "${{ env.GITHUB_TOKEN }}" `
            -Repo "Magnetarman/WinToolkit" `
            -DevBranch "Dev" `
            -MainBranch "main" `
            -ReadmePath "README.md" `
            -TopN 10 `
            -SectionTitle "👥 Top 10 Contributors"
