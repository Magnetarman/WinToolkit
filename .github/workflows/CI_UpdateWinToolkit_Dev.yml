# =============================================================================
# WinToolkit CI/CD Pipeline V 4.0
# =============================================================================
# Pipeline adattiva per branch:
#   • Dev           → Pipeline Completa: lint → test → build (versione letta, no bump)
#   • feature/fix/* → Pipeline Leggera:  lint → test → build (label: "Sviluppo in Corso")
#   • PR verso Dev  → Gate di qualità:   lint → test  (no build, no deploy)
#
# VERSIONING E RELEASE: gestiti dal workflow Create_Release (workflow_dispatch).
#
# REGOLA D'ORO (Integrità):
#   WinToolkit.ps1 è sempre rigenerato da zero dai sorgenti puri.
#   Il file pre-esistente viene eliminato prima di ogni compilazione per evitare
#   che residui di versioni precedenti o conflitti di merge producano output corrotto.
#
# SINTASSI: Tutti i file .ps1 sono validati via AST prima della compilazione.
#   Gli errori vengono emessi come annotazioni inline GitHub (::error file=...).
#
# RUNTIME: PowerShell 7+ (pwsh) — incluso in windows-latest, nessuna installazione aggiuntiva.
# =============================================================================

name: WinToolkit — CI Dev Pipeline V4.0

env:
  # Forza Node 24 nelle Actions per evitare warning GitHub su versioni deprecate
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ---------------------------------------------------------------------------
# TRIGGER
# • Dev             — Pipeline completa al push
# • feature/**      — Pipeline leggera (test + build locale, no release)
# • fix/** feat/**  — Idem
# • PR verso Dev    — Gate di qualità (lint + test, no deploy)
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - Dev
      - "[Ff]eature/**"
      - "[Ff]eatures/**"
      - "[Ff]eature-*"
      - "[Ff]eatures-*"
      - "[Ff]ix/**"
      - "[Ff]ix-*"
      - "[Ff]eat/**"
      - "[Ff]eat-*"
      - "[Hh]otfix/**"
      - "[Hh]otfix-*"
      - "[Bb][Uu][Gg]/**"
      - "[Bb][Uu][Gg]-*"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]/**"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]-*"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]-*"
    paths:
      - "tools/*.ps1"
      - "WinToolkit-template.ps1"
      - "WinToolkit_GUI.ps1"
      - "compiler.ps1"
      - "start.ps1"
      - "start-modules/*.ps1"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
      - ".github/tests/**/*.ps1"
      - ".github/scripts/*.ps1"
  pull_request:
    branches: [Dev]

# ---------------------------------------------------------------------------
# CONCURRENCY — un solo run attivo per branch/PR
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:
  # ===========================================================================
  # JOB 0: PR SECURITY GUARD — Politica a tre livelli
  #
  # Livello 1 — Consentiti (silenzioso)
  #   tools/* | start-modules/*
  #
  # Livello 2 — Consentiti con Warning (revisione manuale richiesta)
  #   start.ps1 | WinToolkit_GUI.ps1 | WinToolkit-template.ps1 | assets/*
  #   → Commento di avviso, PR rimane aperta, job non fallisce.
  #
  # Livello 3 — Protetti (blocco totale)
  #   Qualsiasi altro file (compiler.ps1, .github/**, artefatti compilati, ecc.)
  #   → Commento accesso negato, PR chiusa automaticamente, job fallisce.
  #
  # Gira solo su eventi pull_request verso Dev.
  # ===========================================================================
  pr_security_guard:
    name: PR Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify Changed Files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const author       = context.payload.pull_request.user.login;
            const prNumber     = context.issue.number;
            const isMaintainer = (author.toLowerCase() === 'magnetarman');

            // ── CLASSIFICAZIONE DEI FILE ──────────────────────────────────
            //
            // Livello 1: tools/*, start-modules/* → consentiti, nessuna azione.
            // Livello 2: file sensibili noti + assets/* → accettati, warning.
            // Livello 3: tutto il resto → blocco totale (salvo maintainer).
            //
            // Gli artefatti compilati (WinToolkit.ps1, start-core.ps1) sono
            // generati dalla CI: per il maintainer sono silenziosi (Livello 1),
            // per gli altri restano protetti (Livello 3).

            const SENSITIVE_FILES = new Set([
              'start.ps1',
              'WinToolkit_GUI.ps1',
              'WinToolkit-template.ps1',
            ]);

            const BUILD_ARTIFACTS = new Set([
              'WinToolkit.ps1',
              'start-core.ps1',
            ]);

            function classifyFile(filename) {
              if (filename.startsWith('tools/'))         return 1; // consentito
              if (filename.startsWith('start-modules/')) return 1; // consentito
              if (SENSITIVE_FILES.has(filename))         return 2; // sensibile
              if (filename.startsWith('assets/'))        return 2; // sensibile
              return 3;                                            // protetto
            }

            let level2Files = files.filter(f => classifyFile(f.filename) === 2);
            let level3Files = files.filter(f => classifyFile(f.filename) === 3);

            // ── BYPASS MAINTENER ──────────────────────────────────────────
            // Se l'autore è MagnetarMan, i file di Livello 3 vengono trattati
            // come Livello 2 (Warning non bloccante).
            if (isMaintainer && level3Files.length > 0) {
              level2Files = [...level2Files, ...level3Files];
              level3Files = [];
            }

            // ── ESCLUSIONE ARTEFATTI COMPILATI PER IL MAINTAINER ──────────
            // WinToolkit.ps1 e start-core.ps1 sono output compilati dalla CI
            // stessa: per MagnetarMan non richiedono revisione manuale e sono
            // trattati come Livello 1 (silenzioso). Per tutti gli altri
            // collaboratori il comportamento rimane invariato (Livello 3 → blocco).
            if (isMaintainer) {
              level2Files = level2Files.filter(f => !BUILD_ARTIFACTS.has(f.filename));
            }

            // ── LIVELLO 3: BLOCCO TOTALE ──────────────────────────────────
            if (level3Files.length > 0) {
              const fileList = level3Files.map(f => `- \`${f.filename}\``).join('\n');

              const blockedMessage = [
                `## ⛔ Accesso Negato — PR Chiusa Automaticamente`,
                ``,
                `Ciao @${author},`,
                `grazie per il tuo interesse in WinToolkit! Purtroppo questa PR è stata **chiusa automaticamente** perché include modifiche a file protetti del core del progetto.`,
                ``,
                `### File protetti rilevati`,
                ``,
                fileList,
                ``,
                `### Regola di contribuzione`,
                ``,
                `I collaboratori esterni possono proporre modifiche **esclusivamente** ai moduli all'interno delle cartelle \`tools/\` e \`start-modules/\`.`,
                `I file core (compiler, workflow CI/CD, script di build, configurazioni) sono gestiti direttamente dal maintainer per garantire la stabilità del progetto.`,
                ``,
                `### Come procedere`,
                ``,
                `1. **Ripristina** i file protetti al loro stato originale nel tuo fork.`,
                `2. **Limita** le tue modifiche ai file dentro \`tools/\` o \`start-modules/\`.`,
                `3. **Apri una nuova PR** con solo le modifiche ai moduli.`,
                ``,
                `Se ritieni che una modifica ai file core sia necessaria, apri invece una **Issue** descrivendo la proposta: sarà valutata dal maintainer.`,
                ``,
                `---`,
                `*Messaggio automatico del sistema CI/CD di WinToolkit — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: blockedMessage,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });
              core.setFailed(
                `PR #${prNumber} chiusa: contiene modifiche a ${level3Files.length} file protetti fuori da /tools e /start-modules.`
              );
              return;
            }

            // ── LIVELLO 2: WARNING (PR rimane aperta) ─────────────────────
            if (level2Files.length > 0) {
              const fileList = level2Files.map(f => `- \`${f.filename}\``).join('\n');

              const warningMessage = [
                `## 👀 Attenzione — Revisione Manuale Richiesta`,
                ``,
                `Ciao @${author},`,
                `grazie per il tuo contributo! Questa PR è stata **accettata** e può procedere normalmente nel flusso di revisione.`,
                ``,
                `Tuttavia, il sistema di controllo automatico ha rilevato che sono stati modificati uno o più file **sensibili** di WinToolkit, che influenzano l'interfaccia utente, il template principale o le risorse statiche del progetto:`,
                ``,
                `### File sensibili modificati`,
                ``,
                fileList,
                ``,
                `### Perché questo avviso?`,
                ``,
                `Questi file non sono bloccati per i collaboratori, ma richiedono una **verifica supplementare** da parte del maintainer prima del merge, poiché modifiche non previste potrebbero:`,
                ``,
                `- Alterare il comportamento dell'interfaccia (\`WinToolkit_GUI.ps1\`, \`start.ps1\`)`,
                `- Impattare la compilazione o le funzioni core del framework (\`WinToolkit-template.ps1\`)`,
                `- Introdurre risorse non verificate nella distribuzione (\`assets/\`)`,
                ``,
                `### Prossimi passi`,
                ``,
                `Non è richiesta alcuna azione da parte tua. Il maintainer esaminerà le modifiche con maggiore attenzione prima di procedere al merge.`,
                ``,
                `---`,
                `*Notifica automatica del sistema CI/CD di WinToolkit — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: warningMessage,
              });

              // Avviso visibile nei log di Actions senza fallire il job
              core.notice(
                `PR #${prNumber}: ${level2Files.length} file sensibili modificati ` +
                `(${level2Files.map(f => f.filename).join(', ')}) — revisione manuale consigliata.`
              );
            }

            // ── LIVELLO 1: tools/ e start-modules/ — nessuna azione ────────

  # ===========================================================================
  # JOB DETECT_CHANGES — Rilevazione differenziale per famiglia di sorgenti
  #
  # Output:
  #   run_checks          → almeno una famiglia sorgente (o file CI condiviso) è cambiata
  #   wintoolkit_changed  → sorgenti WinToolkit (tools/, template, GUI, compiler)
  #   start_changed       → sorgenti Start (stub, start-modules/, script build Start)
  #   start_build_changed → solo start-modules/ (richiede rebuild di start-core.ps1)
  #
  # I file CI condivisi (.github/tests, .github/scripts, .github/actions) attivano
  # entrambe le famiglie, perché possono influenzare qualunque build.
  # ===========================================================================
  detect_changes:
    name: Detect Source Changes
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      wintoolkit_changed: ${{ steps.filter.outputs.wintoolkit_changed }}
      start_changed: ${{ steps.filter.outputs.start_changed }}
      start_build_changed: ${{ steps.filter.outputs.start_build_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changes per source family
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi

          echo "File modificati:"
          echo "$CHANGED"

          # --- Pattern per famiglia -------------------------------------------
          WT_PATTERN='^(tools/[^/]+\.ps1|WinToolkit-template\.ps1|WinToolkit_GUI\.ps1|compiler\.ps1)$'
          ST_PATTERN='^(start\.ps1|start-modules/[0-9]{2}-(Skeleton|Module)\.[A-Za-z]+\.ps1|\.github/scripts/(Invoke-Build-Start|Test-CompiledStartScript)\.ps1)$'
          ST_BUILD_PATTERN='^start-modules/[0-9]{2}-(Skeleton|Module)\.[A-Za-z]+\.ps1$'
          SHARED_PATTERN='^\.github/(tests/.*\.ps1|scripts/[^/]+\.ps1|actions/.+)$'

          WT_CHANGED=false
          ST_CHANGED=false
          ST_BUILD_CHANGED=false

          if echo "$CHANGED" | grep -qE "$WT_PATTERN"; then WT_CHANGED=true; fi
          if echo "$CHANGED" | grep -qE "$ST_PATTERN"; then ST_CHANGED=true; fi
          if echo "$CHANGED" | grep -qE "$ST_BUILD_PATTERN"; then ST_BUILD_CHANGED=true; fi

          # I file CI condivisi attivano entrambe le famiglie di controlli.
          if echo "$CHANGED" | grep -qE "$SHARED_PATTERN"; then
            WT_CHANGED=true
            ST_CHANGED=true
          fi

          if [ "$WT_CHANGED" = "true" ] || [ "$ST_CHANGED" = "true" ]; then
            RUN_CHECKS=true
          else
            RUN_CHECKS=false
          fi

          {
            echo "run_checks=$RUN_CHECKS"
            echo "wintoolkit_changed=$WT_CHANGED"
            echo "start_changed=$ST_CHANGED"
            echo "start_build_changed=$ST_BUILD_CHANGED"
          } >> "$GITHUB_OUTPUT"

          echo "run_checks=$RUN_CHECKS wintoolkit_changed=$WT_CHANGED start_changed=$ST_CHANGED start_build_changed=$ST_BUILD_CHANGED"

  # ===========================================================================
  # JOB 1: REUSABLE QUALITY GATE
  # Linting e testing sono definiti in _reusable-lint-test.yml.
  # I controlli WinToolkit e Start sono attivati in modo differenziale.
  # ===========================================================================
  quality:
    name: Lint and test
    needs: detect_changes
    uses: ./.github/workflows/_reusable-lint-test.yml
    with:
      run-checks: ${{ needs.detect_changes.outputs.run_checks == 'true' }}
      validate-template: ${{ needs.detect_changes.outputs.wintoolkit_changed == 'true' }}
      validate-start: ${{ needs.detect_changes.outputs.start_changed == 'true' }}
    permissions:
      contents: read

  # ===========================================================================
  # JOB 2: BUILD — Reusable Workflow
  # Il labeling dinamico e il commit branch-aware sono gestiti dal reusable.
  # Gira solo se i sorgenti WinToolkit sono cambiati e il quality gate è passato.
  # ===========================================================================
  build:
    name: Build
    if: |
      github.event_name == 'push' &&
      needs.detect_changes.outputs.wintoolkit_changed == 'true' &&
      needs.quality.result == 'success'
    needs: [detect_changes, quality]
    uses: ./.github/workflows/_reusable-build-wintoolkit.yml
    with:
      branch: ${{ github.ref_name }}
      commit-message: "✅ Compilato WinToolkit"
    secrets: inherit

  # ===========================================================================
  # JOB 3: BUILD START — Reusable Workflow
  # Gira solo se start-modules/ è cambiato (start-core.ps1 va rigenerato).
  # ===========================================================================
  build-start:
    name: Build start-core.ps1
    if: |
      github.event_name == 'push' &&
      needs.detect_changes.outputs.start_build_changed == 'true' &&
      needs.quality.result == 'success'
    needs: [detect_changes, quality]
    uses: ./.github/workflows/_reusable-build-start.yml
    with:
      branch: ${{ github.ref_name }}
      commit-message: "✅ Compilato start-core.ps1"
    secrets: inherit
