# =============================================================================
# WinToolkit Enterprise CI/CD Pipeline V 3.3.1
# =============================================================================
# Pipeline adattiva per branch:
#   • Dev           → Pipeline Completa: lint → test → build (versione letta, no bump)
#   • feature/fix/* → Pipeline Leggera:  lint → test → build (label: "Sviluppo in Corso")
#   • PR verso Dev  → Gate di qualità:   lint → test  (no build, no deploy)
#
# VERSIONING E RELEASE: gestiti dal workflow Create_Release (workflow_dispatch).
#
# REGOLA D'ORO (Integrità):
#   WinToolkit.ps1 è sempre rigenerato da zero dai sorgenti puri.
#   Il file pre-esistente viene eliminato prima di ogni compilazione per evitare
#   che residui di versioni precedenti o conflitti di merge producano output corrotto.
#
# SINTASSI: Tutti i file .ps1 sono validati via AST prima della compilazione.
#   Gli errori vengono emessi come annotazioni inline GitHub (::error file=...).
#
# RUNTIME: PowerShell 7+ (pwsh) — incluso in windows-latest, nessuna installazione aggiuntiva.
# =============================================================================

name: CI_WinToolkit_Enterprise

env:
  # Forza Node 24 nelle Actions per evitare warning GitHub su versioni deprecate
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ---------------------------------------------------------------------------
# TRIGGER
# • Dev             — Pipeline completa al push
# • feature/**      — Pipeline leggera (test + build locale, no release)
# • fix/** feat/**  — Idem
# • PR verso Dev    — Gate di qualità (lint + test, no deploy)
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - Dev
      - "[Ff]eature/**"
      - "[Ff]eatures/**"
      - "[Ff]eature-*"
      - "[Ff]eatures-*"
      - "[Ff]ix/**"
      - "[Ff]ix-*"
      - "[Ff]eat/**"
      - "[Ff]eat-*"
      - "[Hh]otfix/**"
      - "[Hh]otfix-*"
      - "[Bb][Uu][Gg]/**"
      - "[Bb][Uu][Gg]-*"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]/**"
      - "[Ee][Nn][Hh][Aa][Nn][Cc][Ee][Mm][Ee][Nn][Tt]-*"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**"
      - "[Ff][Ee][Aa][Tt][Uu][Rr][Ee]-*"
    paths:
      - "tools/*.ps1"
      - "WinToolkit-template.ps1"
      - "compiler.ps1"
      - "start-offline.ps1"
      - "start.ps1"
      - ".github/workflows/*.yml"
      - ".github/tests/*.ps1"
      - ".github/scripts/*.ps1"
  pull_request:
    branches: [Dev]

# ---------------------------------------------------------------------------
# CONCURRENCY — un solo run attivo per branch/PR
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:
  # ===========================================================================
  # JOB 0: PR SECURITY GUARD — Politica a tre livelli
  #
  # Livello 1 — Consentiti (silenzioso)
  #   tools/*
  #
  # Livello 2 — Consentiti con Warning (revisione manuale richiesta)
  #   start.ps1 | WinToolkit_GUI.ps1 | WinToolkit-template.ps1 | assets/*
  #   → Commento di avviso, PR rimane aperta, job non fallisce.
  #
  # Livello 3 — Protetti (blocco totale)
  #   Qualsiasi altro file (compiler.ps1, .github/**, ecc.)
  #   → Commento accesso negato, PR chiusa automaticamente, job fallisce.
  #
  # Gira solo su eventi pull_request verso Dev.
  # ===========================================================================
  pr_security_guard:
    name: PR Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify Changed Files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const author       = context.payload.pull_request.user.login;
            const prNumber     = context.issue.number;
            const isMaintainer = (author.toLowerCase() === 'magnetarman');

            // ── CLASSIFICAZIONE DEI FILE ──────────────────────────────────
            //
            // Livello 1: tools/* → sempre consentiti, nessuna azione.
            // Livello 2: file sensibili noti + assets/* → accettati, warning.
            // Livello 3: tutto il resto → blocco totale (salvo maintainer).

            const SENSITIVE_FILES = new Set([
              'start.ps1',
              'WinToolkit_GUI.ps1',
              'WinToolkit-template.ps1',
            ]);

            function classifyFile(filename) {
              if (filename.startsWith('tools/'))       return 1; // consentito
              if (SENSITIVE_FILES.has(filename))       return 2; // sensibile
              if (filename.startsWith('assets/'))      return 2; // sensibile
              return 3;                                           // protetto
            }

            let level2Files = files.filter(f => classifyFile(f.filename) === 2);
            let level3Files = files.filter(f => classifyFile(f.filename) === 3);

            // ── BYPASS MAINTENER ──────────────────────────────────────────
            // Se l'autore è MagnetarMan, i file di Livello 3 vengono trattati
            // come Livello 2 (Warning non bloccante).
            if (isMaintainer && level3Files.length > 0) {
              level2Files = [...level2Files, ...level3Files];
              level3Files = [];
            }

            // ── ESCLUSIONE WinToolkit.ps1 PER IL MAINTAINER ───────────────
            // WinToolkit.ps1 è l'output compilato dalla CI stessa: per
            // MagnetarMan non richiede revisione manuale ed è trattato come
            // Livello 1 (silenzioso). Per tutti gli altri collaboratori il
            // comportamento rimane invariato (Livello 3 → blocco).
            if (isMaintainer) {
              level2Files = level2Files.filter(f => f.filename !== 'WinToolkit.ps1');
            }

            // ── LIVELLO 3: BLOCCO TOTALE ──────────────────────────────────
            if (level3Files.length > 0) {
              const fileList = level3Files.map(f => `- \`${f.filename}\``).join('\n');

              const blockedMessage = [
                `## ⛔ Accesso Negato — PR Chiusa Automaticamente`,
                ``,
                `Ciao @${author},`,
                `grazie per il tuo interesse in WinToolkit! Purtroppo questa PR è stata **chiusa automaticamente** perché include modifiche a file protetti del core del progetto.`,
                ``,
                `### File protetti rilevati`,
                ``,
                fileList,
                ``,
                `### Regola di contribuzione`,
                ``,
                `I collaboratori esterni possono proporre modifiche **esclusivamente** ai moduli all'interno della cartella \`tools/\`.`,
                `I file core (compiler, workflow CI/CD, script di build, configurazioni) sono gestiti direttamente dal maintainer per garantire la stabilità del progetto.`,
                ``,
                `### Come procedere`,
                ``,
                `1. **Ripristina** i file protetti al loro stato originale nel tuo fork.`,
                `2. **Limita** le tue modifiche ai file dentro \`tools/\`.`,
                `3. **Apri una nuova PR** con solo le modifiche ai moduli.`,
                ``,
                `Se ritieni che una modifica ai file core sia necessaria, apri invece una **Issue** descrivendo la proposta: sarà valutata dal maintainer.`,
                ``,
                `---`,
                `*Messaggio automatico del sistema CI/CD di WinToolkit — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: blockedMessage,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });
              core.setFailed(
                `PR #${prNumber} chiusa: contiene modifiche a ${level3Files.length} file protetti fuori da /tools.`
              );
              return;
            }

            // ── LIVELLO 2: WARNING (PR rimane aperta) ─────────────────────
            if (level2Files.length > 0) {
              const fileList = level2Files.map(f => `- \`${f.filename}\``).join('\n');

              const warningMessage = [
                `## 👀 Attenzione — Revisione Manuale Richiesta`,
                ``,
                `Ciao @${author},`,
                `grazie per il tuo contributo! Questa PR è stata **accettata** e può procedere normalmente nel flusso di revisione.`,
                ``,
                `Tuttavia, il sistema di controllo automatico ha rilevato che sono stati modificati uno o più file **sensibili** di WinToolkit, che influenzano l'interfaccia utente, il template principale o le risorse statiche del progetto:`,
                ``,
                `### File sensibili modificati`,
                ``,
                fileList,
                ``,
                `### Perché questo avviso?`,
                ``,
                `Questi file non sono bloccati per i collaboratori, ma richiedono una **verifica supplementare** da parte del maintainer prima del merge, poiché modifiche non previste potrebbero:`,
                ``,
                `- Alterare il comportamento dell'interfaccia (\`WinToolkit_GUI.ps1\`, \`start.ps1\`)`,
                `- Impattare la compilazione o le funzioni core del framework (\`WinToolkit-template.ps1\`)`,
                `- Introdurre risorse non verificate nella distribuzione (\`assets/\`)`,
                ``,
                `### Prossimi passi`,
                ``,
                `Non è richiesta alcuna azione da parte tua. Il maintainer esaminerà le modifiche con maggiore attenzione prima di procedere al merge.`,
                ``,
                `---`,
                `*Notifica automatica del sistema CI/CD di WinToolkit — PR #${prNumber}.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: warningMessage,
              });

              // Avviso visibile nei log di Actions senza fallire il job
              core.notice(
                `PR #${prNumber}: ${level2Files.length} file sensibili modificati ` +
                `(${level2Files.map(f => f.filename).join(', ')}) — revisione manuale consigliata.`
              );
            }

            // ── LIVELLO 1: solo tools/ — nessuna azione necessaria ─────────

  # ===========================================================================
  # JOB DETECT_CHANGES — Rileva modifiche a file sorgente PS1
  # Se le modifiche riguardano solo file CI/CD (.yml) o documentazione,
  # linting/test/build vengono saltati (inutili senza cambiamenti al codice).
  # ===========================================================================
  detect_changes:
    name: Detect Source Changes
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for PS1 source changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi
          echo "File modificati:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(tools/[^/]+\.ps1|WinToolkit-template\.ps1|start\.ps1|start-offline\.ps1|WinToolkit-GUI\.ps1|compiler\.ps1|\.github/(tests|scripts)/[^/]+\.ps1)$'; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "Modifiche a file sorgente PS1 rilevate — pipeline completa."
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica a file sorgente PS1 — linting/test/build saltati."
          fi

  # ===========================================================================
  # JOB 1: REUSABLE QUALITY GATE
  # Linting e testing sono definiti in _reusable-lint-test.yml.
  # ===========================================================================
  quality:
    name: Lint and test
    needs: detect_changes
    uses: ./.github/workflows/_reusable-lint-test.yml
    with:
      run-checks: ${{ needs.detect_changes.outputs.run_checks == 'true' }}
    permissions:
      contents: read

  # ===========================================================================
  # JOB 2: BUILD
  # Gira solo su push. Dipende dal quality gate riutilizzabile.
  #
  # REGOLA D'ORO: elimina WinToolkit.ps1 pre-esistente prima di compilare,
  # garantendo che l'output non contenga mai residui di versioni precedenti
  # o conflitti di merge non risolti.
  #
  # LABELING DINAMICO: su rami non-Dev, sovrascrive $ToolkitVersion con
  # "Sviluppo in Corso" nel workspace (mai committato). Su Dev, legge la
  # versione corrente senza modificarla (il bump avviene solo in Create_Release).
  #
  # Il commit del file compilato usa il branch corrente (Dev o feature/*).
  # ===========================================================================
  build:
    name: Build
    runs-on: windows-latest
    if: always() && github.event_name == 'push' && needs.quality.result == 'success'
    needs: [quality]
    permissions:
      contents: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    outputs:
      source_kb: ${{ steps.build_script.outputs.source_kb }}
      output_kb: ${{ steps.build_script.outputs.output_kb }}
      reduction_percent: ${{ steps.build_script.outputs.reduction_percent }}
      lines_removed: ${{ steps.build_script.outputs.lines_removed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # ── REGOLA D'ORO ────────────────────────────────────────────────────
      - name: Rimozione WinToolkit.ps1 Pre-Esistente (Integrità Build)
        uses: ./.github/actions/pre-build-cleanup
        with:
          artifact-path: WinToolkit.ps1

      # ── LABELING VERSIONE DINAMICO ──────────────────────────────────────
      # Su rami non-Dev: imposta $ToolkitVersion = "Sviluppo in Corso" nel
      # workspace (mai committato). Su Dev: legge la versione esistente.
      - name: Labeling Versione Dinamico
        id: version_label
        shell: pwsh
        run: |
          $templatePath = "WinToolkit-template.ps1"
          $content = Get-Content -Raw -Path $templatePath -Encoding UTF8
          if ('${{ github.ref_name }}' -ne 'Dev') {
            $content = $content -replace '\$ToolkitVersion\s*=\s*"[^"]+"', '$ToolkitVersion = "Sviluppo in Corso"'
            Set-Content -Path $templatePath -Value $content -Encoding UTF8
            Write-Host "Label di versione impostata su 'Sviluppo in Corso' per ramo ${{ github.ref_name }}." -ForegroundColor Yellow
            "new_version=Sviluppo in Corso" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            if ($content -match '\$ToolkitVersion\s*=\s*"([^"]+)"') {
              $currentVersion = $Matches[1]
              Write-Host "Branch Dev: versione corrente: $currentVersion" -ForegroundColor Cyan
              "new_version=$currentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              Write-Host "::error::Impossibile leggere ToolkitVersion dal template."
              exit 1
            }
          }

      # ── PRE-CHECK SINTATTICO ─────────────────────────────────────────────
      - name: Validate tools syntax before build
        id: syntax_tools
        uses: ./.github/actions/validate-syntax
        with:
          path: tools/*.ps1
          label: tools before build

      - name: Validate template syntax before build
        id: syntax_template
        uses: ./.github/actions/validate-syntax
        with:
          path: WinToolkit-template.ps1
          label: WinToolkit-template.ps1 before build

      # ── COMPILAZIONE ────────────────────────────────────────────────────
      - name: Compilazione WinToolkit.ps1
        id: build_script
        shell: pwsh
        run: |
          $version = "${{ steps.version_label.outputs.new_version }}"
          & .github/scripts/Invoke-Build.ps1 -Version $version -OutputPath "WinToolkit.ps1"

      # ── VERIFICA FILE COMPILATO ──────────────────────────────────────────
      - name: Test File Compilato
        id: test_compiled
        shell: pwsh
        run: |
          & .github/scripts/Test-CompiledScript.ps1 -ScriptPath "WinToolkit.ps1"

      # ── COMMIT — branch-aware (Dev o feature/*) ─────────────────────────
      - name: Commit WinToolkit.ps1
        if: steps.test_compiled.outputs.tests_passed == 'true'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "✅ Compilato WinToolkit v${{ steps.version_label.outputs.new_version }}"
          file_pattern: "WinToolkit.ps1"
          branch: ${{ github.ref_name }}
          push_options: "--force-with-lease"
          skip_fetch: true

      # ── SUMMARY (solo Dev) ───────────────────────────────────────────────
      - name: Generate Build Summary
        if: steps.test_compiled.outputs.tests_passed == 'true' && github.ref == 'refs/heads/Dev'
        shell: pwsh
        run: |
          $version      = "${{ steps.version_label.outputs.new_version }}"
          $sourceKB     = "${{ steps.build_script.outputs.source_kb }}"
          $outputKB     = "${{ steps.build_script.outputs.output_kb }}"
          $reduction    = "${{ steps.build_script.outputs.reduction_percent }}"
          $linesRemoved = "${{ steps.build_script.outputs.lines_removed }}"

          $summary = @"
          ## Riepilogo Build - WinToolkit v$version

          | Metrica          | Valore         |
          |------------------|----------------|
          | Peso Sorgente    | $sourceKB KB   |
          | Peso Finale      | $outputKB KB   |
          | Riduzione        | $reduction%    |
          | Righe Eliminate  | $linesRemoved  |

          **Branch**: ${{ github.ref_name }} | **Stato**: Build completata con successo
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║   BUILD COMPLETATA CON SUCCESSO          ║" -ForegroundColor Green
          Write-Host "╚══════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host "  Versione : v$version"    -ForegroundColor White
          Write-Host "  Riduzione: $reduction%"  -ForegroundColor White
