name: Security Analysis (PSScriptAnalyzer)

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
  schedule:
    # Ogni lunedì alle 00:00 UTC
    - cron: "0 0 * * 1"

jobs:
  security-scan:
    name: Analisi sicurezza PowerShell
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installa PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.21.0

      - name: Esegui analisi sicurezza
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -Settings .github/linters/PSScriptAnalyzer-settings.psd1 `
            -IncludeRule PSAvoidUsingConvertToSecureStringWithPlainText,
                         PSAvoidUsingPlainTextForPassword,
                         PSAvoidUsingUsernameAndPasswordParams,
                         PSAvoidUsingInvokeExpression,
                         PSAvoidUsingWriteHost,
                         PSUseShouldProcessForStateChangingFunctions

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Output "::warning::Trovati $($results.Count) problemi di sicurezza."
          } else {
            Write-Output "Nessun problema di sicurezza rilevato."
          }

      - name: Blocca su errori critici
        shell: pwsh
        run: |
          $errors = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Error `
            -IncludeRule PSAvoidUsingConvertToSecureStringWithPlainText,
                         PSAvoidUsingPlainTextForPassword,
                         PSAvoidUsingUsernameAndPasswordParams,
                         PSAvoidUsingInvokeExpression

          if ($errors) {
            $errors | Format-Table -AutoSize
            throw "Rilevati $($errors.Count) errori critici di sicurezza. Build bloccata."
          }
