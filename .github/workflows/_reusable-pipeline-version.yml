# Reusable pipeline version sync
# Reads PIPELINE_VERSION from the canonical workflow and aligns the version token
# in every workflow and composite action, then commits the result.
name: WinToolkit V4.1.0 — Reusable pipeline version sync

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to align and receive the commit.
        required: true
        type: string
      version:
        description: Explicit version; empty means "read PIPELINE_VERSION from the canonical workflow".
        required: false
        type: string
        default: ''
      canonical-workflow:
        description: Workflow holding the canonical PIPELINE_VERSION value.
        required: false
        type: string
        default: '.github/workflows/CI-WinToolkit-Dev.yml'
      commit-message:
        description: Commit message for the alignment.
        required: false
        type: string
        default: '🆙 Sync pipeline version'
      skip-ci:
        description: Append [skip ci] to the alignment commit. The alignment is cosmetic (version tokens only), so it must not start a new run that would cancel the one in progress.
        required: false
        type: boolean
        default: true

jobs:
  sync:
    name: Reusable pipeline version sync
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Align pipeline version
        id: align
        shell: pwsh
        run: |
          $params = @{ CanonicalWorkflow = '${{ inputs.canonical-workflow }}' }
          if ('${{ inputs.version }}') { $params['Version'] = '${{ inputs.version }}' }

          # The script reports the files it actually aligned, one relative path per
          # line: only those are validated and committed.
          $list = Join-Path $env:RUNNER_TEMP 'pipeline-version-changed.txt'
          $params['ChangedFileListPath'] = $list
          & .github/scripts/Update-PipelineVersion.ps1 @params

          $changed = @(if (Test-Path -LiteralPath $list) { Get-Content -LiteralPath $list } else { @() })
          "changed=$($changed.Count -gt 0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "files=$($changed -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($changed) { $changed | ForEach-Object { Write-Host "  aligned: $_" } }

      - name: Verify the alignment converged
        if: steps.align.outputs.changed == 'true'
        shell: pwsh
        run: |
          # What can actually go wrong after an alignment: a version token that did
          # not converge. That is exactly what -Check reports, so it is the only gate
          # this step needs.
          #
          # The workflows are deliberately NOT re-parsed here. This step used to hand
          # .github\workflows\*.yml to the validate-syntax action, which runs the
          # PowerShell AST parser: the parser cannot read YAML and answered a valid
          # workflow with a wall of meaningless "PowerShell syntax error" annotations
          # (unexpected token 'name:', missing expression after unary operator '-',
          # and so on). Re-parsing YAML with a PowerShell parser can only ever
          # produce false errors, and GitHub has already parsed the YAML of the
          # workflow that is running right now.
          $params = @{ CanonicalWorkflow = '${{ inputs.canonical-workflow }}' }
          if ('${{ inputs.version }}') { $params['Version'] = '${{ inputs.version }}' }
          & .github/scripts/Update-PipelineVersion.ps1 @params -Check

      - name: Commit pipeline version alignment
        # The alignment is already applied in the workspace, so a refused push (branch
        # protection, read-only token) must not turn the run red: the next push to Dev
        # re-aligns and commits it.
        if: steps.align.outputs.changed == 'true'
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with: |
          commit_message: ${{ inputs.skip-ci && format('{0} [skip ci]', inputs.commit-message) || inputs.commit-message }}
          file_pattern: ${{ steps.align.outputs.files }}
          branch: ${{ inputs.branch }}
          push_options: --force-with-lease
          skip_fetch: true
