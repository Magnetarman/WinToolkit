# Reusable pipeline version sync
# Reads PIPELINE_VERSION from the canonical workflow and aligns the version token
# in every workflow and composite action, then commits the result.
name: WinToolkit V4.1.0 — Reusable pipeline version sync

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to align and receive the commit.
        required: true
        type: string
      version:
        description: Explicit version; empty means "read PIPELINE_VERSION from the canonical workflow".
        required: false
        type: string
        default: ''
      canonical-workflow:
        description: Workflow holding the canonical PIPELINE_VERSION value.
        required: false
        type: string
        default: '.github/workflows/CI-WinToolkit-Dev.yml'
      commit-message:
        description: Commit message for the alignment.
        required: false
        type: string
        default: '🆙 Sync pipeline version'
      skip-ci:
        description: Append [skip ci] to the alignment commit. The alignment is cosmetic (version tokens only), so it must not start a new run that would cancel the one in progress.
        required: false
        type: boolean
        default: true

jobs:
  sync:
    name: Reusable pipeline version sync
    runs-on: windows-latest
    # NOTE: there is deliberately no `workflows:` scope here. It does not exist for
    # GITHUB_TOKEN. The documented scopes are actions, artifact-metadata,
    # attestations, checks, code-quality, contents, deployments, discussions,
    # id-token, issues, models, packages, pages, pull-requests,
    # repository-projects, security-events, statuses, vulnerability-alerts.
    # Declaring it does not even parse:
    #   Invalid workflow file: (Line: 49, Col: 7): Unexpected value 'workflows'
    # `workflows` only exists as a GitHub App / PAT permission, which is exactly
    # why committing an alignment needs RELEASE_AUTOMATION_TOKEN (see the guard
    # below). `contents: write` is still required: it is what lets the checkout and
    # the align step write the files in the workspace before the push.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TOKEN CONTRACT: this exact expression is the credential for the whole
          # job. It is repeated verbatim on every git-auto-commit-action step so the
          # checkout and the push can never end up using different identities.
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Align pipeline version
        id: align
        shell: pwsh
        run: |
          $params = @{ CanonicalWorkflow = '${{ inputs.canonical-workflow }}' }
          if ('${{ inputs.version }}') { $params['Version'] = '${{ inputs.version }}' }

          # The script reports the files it actually aligned, one relative path per
          # line: only those are validated and committed.
          $list = Join-Path $env:RUNNER_TEMP 'pipeline-version-changed.txt'
          $params['ChangedFileListPath'] = $list
          & .github/scripts/Update-PipelineVersion.ps1 @params

          $changed = @(if (Test-Path -LiteralPath $list) { Get-Content -LiteralPath $list } else { @() })
          "changed=$($changed.Count -gt 0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "files=$($changed -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($changed) { $changed | ForEach-Object { Write-Host "  aligned: $_" } }

      - name: Verify the alignment converged
        if: steps.align.outputs.changed == 'true'
        shell: pwsh
        run: |
          # What can actually go wrong after an alignment: a version token that did
          # not converge. That is exactly what -Check reports, so it is the only gate
          # this step needs.
          #
          # The workflows are deliberately NOT re-parsed here. This step used to hand
          # .github\workflows\*.yml to the validate-syntax action, which runs the
          # PowerShell AST parser: the parser cannot read YAML and answered a valid
          # workflow with a wall of meaningless "PowerShell syntax error" annotations
          # (unexpected token 'name:', missing expression after unary operator '-',
          # and so on). Re-parsing YAML with a PowerShell parser can only ever
          # produce false errors, and GitHub has already parsed the YAML of the
          # workflow that is running right now.
          $params = @{ CanonicalWorkflow = '${{ inputs.canonical-workflow }}' }
          if ('${{ inputs.version }}') { $params['Version'] = '${{ inputs.version }}' }
          & .github/scripts/Update-PipelineVersion.ps1 @params -Check

      - name: Verify the push credential can write workflow files
        # Fail here, with instructions, instead of letting the push die on an
        # opaque API rejection. GITHUB_TOKEN is a GitHub App token and the API
        # refuses to let it update .github/workflows/*.yml:
        #   [remote rejected] HEAD -> <branch> (refusing to allow a GitHub App to
        #   create or update workflow `.github/workflows/...` without `workflows`
        #   permission)
        # and no permissions block can grant it, because `workflows` is not a
        # GITHUB_TOKEN scope. Only a PAT carries it.
        if: steps.align.outputs.changed == 'true'
        shell: pwsh
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN != '' }}
        run: |
          if ($env:HAS_RELEASE_TOKEN -eq 'true') { exit 0 }

          Write-Host '::error::Cannot commit the pipeline version alignment: RELEASE_AUTOMATION_TOKEN is not set.'
          Write-Host 'The alignment rewrites .github/workflows/*.yml and .github/actions/*/action.yml.'
          Write-Host 'GITHUB_TOKEN is refused for workflow files and cannot be granted the scope:'
          Write-Host '  [remote rejected] refusing to allow a GitHub App to create or update workflow ... without ''workflows'' permission'
          Write-Host 'Create a fine-grained PAT (Settings > Developer settings > Personal access tokens > Fine-grained tokens):'
          Write-Host '  Repository access : this repository'
          Write-Host '  Contents          : Read and write'
          Write-Host '  Workflows         : Read and write'
          Write-Host 'then store it as the RELEASE_AUTOMATION_TOKEN repository secret.'
          Write-Host 'Until then, run .\.github\scripts\Update-PipelineVersion.ps1 locally and commit the result.'
          exit 1

      - name: Commit pipeline version alignment
        # No continue-on-error here. It used to hide this step completely: a
        # green job whose only real work never ran. A failed push (branch
        # protection, read-only token) is worth surfacing anyway, because until
        # the commit lands the whole .github tree stays one version behind.
        if: steps.align.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        # A plain mapping, never a `with: |` block scalar. GitHub evaluates the
        # ${{ }} expressions inside the block first, then hands the whole
        # rendered block to the step as a single string where a mapping of inputs
        # is expected, and rejects the template:
        #   ##[error]The template is not valid. (Line: 95, Col: 15): Unexpected value
        # It only surfaced when changed == 'true', so on every run before this one
        # the step was skipped and its inputs were never validated.
        with:
          commit_message: ${{ inputs.skip-ci && format('{0} [skip ci]', inputs.commit-message) || inputs.commit-message }}
          file_pattern: ${{ steps.align.outputs.files }}
          branch: ${{ inputs.branch }}
          # Same credential as the checkout above, always. The action would default
          # to github.token, so without this line checkout and push would silently
          # diverge as soon as RELEASE_AUTOMATION_TOKEN is set: the PAT would read
          # the branch and GITHUB_TOKEN would be the one refused for lacking
          # `workflows`. See TOKEN CONTRACT in the checkout step.
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          push_options: --force-with-lease
          skip_fetch: true
