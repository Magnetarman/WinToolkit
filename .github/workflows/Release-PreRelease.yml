# =============================================================================
# WinToolkit — Create Pre-Release V 4.0.1
# =============================================================================
# Manual workflow for creating official pre-releases.
#
# Trigger: workflow_dispatch (manual only)
#
# Security constraints:
#   - Runnable ONLY on the Dev branch (fails immediately elsewhere)
#   - Runnable ONLY by the user MagnetarMan
#
# Flow:
#   Job 0 -- validate:    Verify repository, branch and actor (ubuntu, fast)
#   Job 1 -- versioning:  Bump the build number in the template, commit on Dev
#   Job 2 -- build:       Compile WinToolkit.ps1 from the updated template
#   Job 3 -- build-start: Compile start-core.ps1 from start-modules/
#   Job 4 -- release:     Release notes and GitHub Pre-Release
#
# RUNTIME: PowerShell 7+ (pwsh) -- windows-latest; ubuntu-latest for fast checks.
# =============================================================================

name: WinToolkit — Create Pre-Release V4.0.1

on:
  workflow_dispatch:

env:
  # Force Node 24 in Actions to avoid GitHub warnings about deprecated versions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # JOB 0: VALIDATE -- Security checks
  # Fails immediately if repo != Magnetarman/WinToolkit, branch != Dev
  # or actor != MagnetarMan.
  # Runs on ubuntu-latest for speed (no PowerShell dependency).
  # ===========================================================================
  validate:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Verify Branch
        run: |
          if [ "${{ github.ref_name }}" != "Dev" ]; then
            echo "::error::This workflow can only be run on the Dev branch. Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "Branch: Dev ✓"

      - name: Verify Official Repository
        run: |
          if [ "${{ github.repository }}" != "Magnetarman/WinToolkit" ]; then
            echo "::error::Action not allowed: this manual workflow is supported only in the official repository https://github.com/Magnetarman/WinToolkit/. Current repository: ${{ github.repository }}"
            exit 1
          fi
          echo "Official repository verified ✓"

      - name: Verify Actor
        run: |
          if [ "${GITHUB_ACTOR,,}" != "magnetarman" ]; then
            echo "::error::Action not allowed: this manual workflow is supported only for the maintainer @Magnetarman in the official repository. Current actor: ${{ github.actor }}"
            exit 1
          fi
          echo "Actor: MagnetarMan ✓"

  # ===========================================================================
  # JOB 1: VERSIONING -- Bump the build number and commit on Dev
  # ===========================================================================
  versioning:
    name: Versioning (Bump)
    needs: validate
    if: github.actor == 'MagnetarMan' || github.actor == 'Magnetarman'
    uses: ./.github/workflows/_reusable-versioning.yml
    with:
      target-branch: Dev
      sync-github: true
      commit-message: "🆙 Bump version and sync .github"
    secrets: inherit

  # ===========================================================================
  # JOB 2: BUILD -- Reusable Workflow
  # ===========================================================================
  build:
    name: Build
    needs: versioning
    if: github.actor == 'MagnetarMan' || github.actor == 'Magnetarman'
    uses: ./.github/workflows/_reusable-build-wintoolkit.yml
    with:
      branch: Dev
      version: ${{ needs.versioning.outputs.new_version }}
      minify: true
      commit-message: "✅ Build WinToolkit v${{ needs.versioning.outputs.new_version }}"
    secrets: inherit

  # ===========================================================================
  # JOB 3: BUILD START -- Reusable Workflow
  # ===========================================================================
  build-start:
    name: Build start-core.ps1
    needs: versioning
    if: github.actor == 'MagnetarMan' || github.actor == 'Magnetarman'
    uses: ./.github/workflows/_reusable-build-start.yml
    with:
      branch: Dev
      version: ${{ needs.versioning.outputs.new_version }}
      commit-message: "✅ Build start-core.ps1 v${{ needs.versioning.outputs.new_version }}"
    secrets: inherit

  # ===========================================================================
  # JOB 4: RELEASE -- Release notes and GitHub Pre-Release
  # PRs/Issues are included (MagnetarMan is NOT excluded, only automated bots are).
  # Categorized into: Features, Bug Fixes, Enhancement, Changes.
  # ===========================================================================
  release:
    name: Release
    runs-on: windows-latest
    needs: [versioning, build, build-start]
    if: github.actor == 'MagnetarMan' || github.actor == 'Magnetarman'
    permissions:
      contents: write
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: Dev

      - name: Extract PRs and Generate Notes
        id: notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .github/scripts/New-ReleaseNotes.ps1 `
            -Version          "${{ needs.versioning.outputs.new_version }}" `
            -SourceKB         "${{ needs.build.outputs.source_kb }}" `
            -OutputKB         "${{ needs.build.outputs.output_kb }}" `
            -ReductionPercent "${{ needs.build.outputs.reduction_percent }}" `
            -LinesRemoved     "${{ needs.build.outputs.lines_removed }}"

      - name: Create Pre-Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.versioning.outputs.new_version }}"
          if (-not $version -or $version -eq '') {
            Write-Host "::error::The release version is empty. Check the output of the versioning job."
            exit 1
          }
          $tag = "v$version" -replace ' \(', '-' -replace '\)', '' -replace ' ', ''
          Write-Host "Creating pre-release: '$version' -> tag '$tag'"
          gh release create $tag "WinToolkit.ps1" "start-core.ps1" `
            --title "WinToolkit $tag (Pre-Release)" `
            --notes-file release_body.md `
            --prerelease `
            --target Dev
